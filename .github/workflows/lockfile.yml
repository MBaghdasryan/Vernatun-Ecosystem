name: Lockfile

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frozen-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - name: Verify lockfile with pnpm 9.15.9
        run: pnpm install --frozen-lockfile
