        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: unitId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Unit-level device permission revoked }
        '404': { description: Device access not found }
  /edge-console/alarms:
    get:
