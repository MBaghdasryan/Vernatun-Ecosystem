openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /invitations:
    get:
      operationId: listInvitations
      summary: List invitations in the active permission scope
      responses:
        "200":
          description: Scoped invitations; transport acceptance is not confirmed delivery
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
  /invitations/{id}/resend:
    post:
      operationId: resendInvitation
      summary: Rotate and resend an eligible invitation, optionally correcting its email
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationResendInput"
      responses:
        "200":
          description: Transport receipt, not mailbox confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSendReceipt"
        "409":
          description: Accepted or revoked invitations cannot be resent
        "503":
          description: Send failed or provider is not configured; no success receipt
  /invitations/{id}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an unaccepted invitation in the active permission scope
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found or outside the active scope
  /webhooks/resend:
    post:
      operationId: receiveResendDeliveryEvent
      summary: Receive signed delivery evidence; raw bytes must match the Svix signature
      description: Sent, delayed, delivered, bounced, complained and failed are retained. Opens and clicks are ignored. Canonical future URL https://vernatun.io/api/webhooks/resend; domain activation and live verification are pending.
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string, maxLength: 200 }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendDeliveryInput"
      responses:
        "204":
          description: Persisted, already received, or deliberately ignored event
        "400":
          description: Invalid signature, timestamp or payload
        "503":
          description: Signing secret is not configured or storage is temporarily unavailable; retry
        "413":
          description: Body exceeds 32 KiB
        "429":
          description: Rate limited; retry
        "500":
          description: Retryable persistence error
  /email-webhooks/resend:
    post:
      operationId: receiveLegacyResendDeliveryEvent
      deprecated: true
      summary: Compatibility alias; use /webhooks/resend with the same Svix headers
      responses:
        "204": { description: "Persisted, duplicate or ignored event" }
        "400": { description: Invalid signature or payload }
        "503": { description: Not configured or temporarily unavailable }
  /platform/email/health:
    get:
      operationId: getEmailHealth
      summary: Platform-admin-only email evidence and configuration health
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Configuration is not verified credentials/domain or confirmed live delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailHealth" }
        "400": { description: Invalid period; maximum 366 days }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
  /platform/email/messages:
    get:
      operationId: listEmailMessages
      summary: Platform-admin-only masked message log, server-side filters and pagination
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EmailStatus" } }
        - { name: provider, in: query, schema: { type: string, enum: [resend, smtp, outbox, disabled] } }
        - { name: businessType, in: query, schema: { $ref: "#/components/schemas/EmailBusinessType" } }
        - { name: recipient, in: query, schema: { type: string, maxLength: 254 } }
      responses:
        "200":
          description: Consistent count/page snapshot; recipients masked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailMessagePage" }
        "400": { description: Invalid filter or pagination }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
  /platform/email/messages/{id}:
    get:
      operationId: getEmailMessage
      summary: Platform-admin-only masked message and safe chronological delivery timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: No raw payload, email body, token, URL or secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailMessageDetail" }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
        "404": { description: Message not found }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    EmailStatus:
      type: string
      enum: [unknown, local, accepted, sent, delayed, delivered, bounced, complained, failed]
    EmailBusinessType:
      type: string
      enum: [invitation, password_reset, delegation, notification, platform_invoice, support, other]
    EmailMessage:
      type: object
      required: [id, business_type, provider, recipient_masked, status, created_at]
      properties:
        id: { type: string, format: uuid }
        business_type: { $ref: "#/components/schemas/EmailBusinessType" }
        business_id: { type: [string, "null"], format: uuid }
        provider: { type: string }
        provider_scope: { type: string }
        recipient_masked: { type: string }
        provider_message_id_short: { type: [string, "null"] }
        sender: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EmailStatus" }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time }
    EmailMessagePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EmailMessage" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    EmailMessageDetail:
      type: object
      required: [message, events]
      properties:
        message: { $ref: "#/components/schemas/EmailMessage" }
        events:
          type: array
          items:
            type: object
            required: [event_type, outcome, occurred_at, received_at, safe_metadata]
            properties:
              event_type: { type: string }
              outcome: { $ref: "#/components/schemas/EmailStatus" }
              occurred_at: { type: string, format: date-time }
              received_at: { type: string, format: date-time }
              safe_metadata: { type: object, additionalProperties: { type: string } }
    EmailHealth:
      type: object
      required: [provider, providerStatus, sender, period, counts, deliveryRate, webhook, liveVerification]
      properties:
        provider: { type: string }
        providerStatus: { type: string, enum: [configured_unverified, not_configured] }
        sender: { type: [string, "null"] }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        counts: { type: object, additionalProperties: { type: integer } }
        deliveryRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Fraction of accepted-send cohort currently in delivered aggregate status; excludes local and unknown
        lastAccepted: { type: [string, "null"], format: date-time }
        lastDelivered: { type: [string, "null"], format: date-time }
        lastBounce: { type: [string, "null"], format: date-time }
        lastComplaint: { type: [string, "null"], format: date-time }
        lastFailure: { type: [string, "null"], format: date-time }
        liveVerification: { type: string, enum: [not_performed] }
        webhook:
          type: object
          required: [configured, signatureVerificationReady, recentFailures]
          properties:
            configured: { type: boolean }
            signatureVerificationReady: { type: boolean }
            lastEventReceived: { type: [string, "null"], format: date-time }
            lastValidEvent: { type: [string, "null"], format: date-time }
            lastInvalidSignature: { type: [string, "null"], format: date-time }
            recentFailures: { type: integer }
    Invitation:
      type: object
      required: [id, email, role_key, organization_id, organization_name, expires_at, status, email_delivery_status, delivery_outcome, delivery_evidence]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role_key: { type: string }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        delegation_id: { type: [string, "null"], format: uuid }
        status:
          type: string
          enum: [pending, expired, accepted, revoked]
        email_delivery_status:
          type: string
          enum: [unknown, local, sent, failed]
        email_delivery_at: { type: [string, "null"], format: date-time }
        delivery_outcome:
          type: string
          enum: [unknown, local, accepted, sent, delayed, failed, delivered, bounced, complained]
        delivery_outcome_at: { type: [string, "null"], format: date-time }
        delivery_provider: { type: [string, "null"] }
        delivery_evidence:
          type: boolean
          description: Adapter supports delivery evidence; does not itself mean delivered
    InvitationResendInput:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
    InvitationSendReceipt:
      type: object
      required: [id, expires_at, delivery, provider]
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        delivery:
          type: string
          enum: [local_only, smtp_accepted, resend_accepted, provider_accepted]
        provider: { type: string }
        messageId: { type: string }
        url:
          type: string
          description: Private local-only outbox link; never returned for live delivery
    ResendDeliveryInput:
      type: object
      required: [type]
      properties:
        type: { type: string }
        created_at: { type: string, format: date-time }
        data:
          type: object
          properties:
            email_id: { type: string, format: uuid }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

