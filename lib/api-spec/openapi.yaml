  /platform/implementation-diagnostics:
    get:
      operationId: getImplementationDiagnostics
      responses:
        "200":
          description: Read-only implementation diagnostics available to global support operators; not tenant access or a backup certification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImplementationDiagnostics" }
        "403": { description: Global implementation authority required }
  /platform/knowledge-base:
    get:
      operationId: getSupportKnowledgeBase
      parameters:
        - name: language
          in: query
          schema: { type: string, enum: [hy, ru, en], default: hy }
      responses:
        "200":
          description: Maintained operational instructions, not customer records.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportKnowledgeArticle" }
        "403": { description: Global implementation authority required }
  /notifications/unread-count:
    get:
      operationId: getUnreadNotificationCount
      responses:
        "200":
          description: Exact unread in-app count for the authenticated account, without exposing notification contents.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnreadNotificationCount" }
  /workspace-search:
    get:
      operationId: searchWorkspace
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: Grouped results restricted to the current authorized context; each group is capped and reports truncation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceSearchResult" }
        "401": { description: Authentication required }
        "403": { description: No active authorized context }
  /auth/session:
    get:
      operationId: getMobileAuthSession
      responses:
        "200":
          description: Current cookie session and authorized contexts; csrf is safe to return to this client.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileAuthSession" }
  /auth/login:
    post:
      operationId: loginMobileAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileAuthLoginInput" }
      responses:
        "200":
          description: Authenticated cookie session and available contexts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileAuthLoginResult" }
        "401": { description: Invalid credentials }
  /auth/context:
    post:
      operationId: switchMobileAuthContext
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MobileAuthContextInput" }
      responses:
        "200":
          description: Switched to an already authorized context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MobileAuthContextResult" }
        "403": { description: Context is not authorized for this user }
  /auth/logout:
    post:
      operationId: logoutMobileAuth
      responses:
        "204": { description: Session ended and cookie cleared }
  /health:
    get:
      operationId: getApiHealth
      tags: [health]
      summary: Check API and database availability
      description: Checks the API process and its PostgreSQL connection.
      responses:
        "200":
          description: API and database are available.
          content:
            application/json:
              schema:
                type: object
                required: [status, stage]
                additionalProperties: false
                properties:
                  status: { type: string, enum: [ok] }
                  stage: { type: integer, minimum: 1 }
        "503":
          description: API database health check failed.
  /hayat/queue:
    get:
      operationId: getHayatQueue
      description: Existing role-scoped operational queue. Technician metrics use only active assignments in the current server-authorized organization/building/unit scope. Checklist percent is null when no checklist items exist; upcoming counts assigned or in-progress work with a future visit or SLA deadline.
      parameters:
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: status, in: query, schema: { type: string, maxLength: 40 } }
        - { name: focus, in: query, schema: { type: string, enum: ["", unassigned, overdue, urgent, checklist, upcoming] } }
        - { name: priority, in: query, schema: { type: string, enum: ["", low, normal, high, urgent, emergency] } }
        - { name: sort, in: query, schema: { type: string, enum: [created, priority, due] } }
        - { name: building, in: query, schema: { type: string, format: uuid } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, maximum: 100000 } }
      responses:
        "200":
          description: Server-filtered queue and status counts.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HayatQueueResponse" }
        "403": { description: Active context does not have a supported queue role or permission }
  /defects/{id}/transition:
    post:
      operationId: transitionAssignedDefect
