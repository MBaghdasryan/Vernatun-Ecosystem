        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceGenerationInput" }
      responses:
        "200":
          description: Existing or newly generated due event with linked request and work order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecord" }
  /maintenance/{id}/events:
    get:
      operationId: getMaintenanceEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized equipment maintenance history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceRecord" }
  /assets/lookup:
    get:
      operationId: lookupEquipment
      parameters:
        - { name: identifier, in: query, required: true, schema: { type: string, maxLength: 160 } }
      responses:
        "200":
          description: Scoped asset plans work history and unit identifiers; identifier never grants access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
        "404": { description: Asset not in authorized scope }
  /incidents/{id}:
    get:
      operationId: getOperationalIncident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Scoped incident with append-only history and private attachments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
  /incidents/{id}/transition:
    post:
      operationId: transitionIncident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentTransitionInput" }
      responses:
        "200": { description: Incident transitioned with historical snapshot }
  /operations/visits:
    get:
      operationId: listOperationalVisits
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Active visits in a bounded date range and the current request scope. Each row includes building_id, technician_id and technician_name (nullable). More than 1000 matches returns visit_window_too_large rather than a partial calendar.
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OperationalRow"}}
  /assets/{id}/qr:
    get:
      operationId: getAssetQr
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: QR encodes an identifier, never an authorization grant
          content:
            image/png:
              schema: {type: string, format: binary}
  /requests/{id}/photos:
    post:
      operationId: uploadOperationalPhoto
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: photoType, in: query, schema: {type: string, enum: [before, during, after, evidence]}}
        - {name: X-Operation-Key, in: header, schema: {type: string, format: uuid}}
        - {name: X-Work-Version, in: header, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {$ref: "#/components/schemas/PrivateImageInput"}
      responses:
        "201":
          description: Sanitized private photo metadata; stable operation key permits safe retry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incidents:
    get:
      operationId: listOperationalIncidents
      responses:
        "200":
          description: Incident list within current organization/building/unit scope
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OperationalRow"}}
    post:
      operationId: createOperationalIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IncidentInput"}
      responses:
        "201":
          description: Created incident with append-only history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incidents/{id}/attachments:
    post:
      operationId: uploadIncidentEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Operation-Key, in: header, schema: {type: string, format: uuid}}
        - {name: X-Work-Version, in: header, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {$ref: "#/components/schemas/PrivateImageInput"}
      responses:
        "201":
          description: Sanitized private incident evidence metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incident-attachments/{id}:
    get:
      operationId: getIncidentEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Private image after fresh incident authorization
          content:
            image/jpeg:
              schema: {type: string, format: binary}
  /finance/batches/preview:
    post:
      operationId: previewBillingBatch
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingBatchInput" } } } }
      responses:
        "200": { description: Scoped calculation without ledger writes, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/batches:
    get:
      operationId: listBillingBatches
      responses:
        "200": { description: Scoped batches, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
    post:
      operationId: createBillingDraft
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingDraftInput" } } } }
      responses:
        "201": { description: Frozen draft without invoices, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/batches/{id}/{action}:
    post:
      operationId: transitionBillingBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [publish, cancel] } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingPublicationInput" } } } }
      responses:
        "200": { description: Atomic publication or draft cancellation, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/bank/imports/preview:
    post:
      operationId: previewBankImport
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BankImportInput" } } } }
      responses:
        "200": { description: Import validation and duplicate/conflict evidence, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/bank/imports:
    get:
      operationId: listBankImports
      responses:
        "200": { description: Imported statement metadata, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
    post:
      operationId: commitBankImport
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BankImportInput" } } } }
      responses:
        "201": { description: Atomic import only; no payments confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/bank/transactions:
    get:
      operationId: listBankTransactions
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [matched, partially_matched, unmatched, ignored] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200": { description: Transactions with current allocation status, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
  /finance/bank/transactions/{id}/suggestions:
    get:
      operationId: suggestBankMatches
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, schema: { type: string, format: uuid } }
        - { name: payerId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Suggestions never automatically confirm money, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
  /finance/bank/transactions/{id}/confirm:
    post:
      operationId: confirmBankTransaction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BankConfirmationInput" } } } }
      responses:
        "200": { description: "Payment, allocations and unit-account credit in one transaction", content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/bank/transactions/{id}/ignore:
    post:
      operationId: ignoreBankTransaction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BankIgnoreInput" } } } }
      responses:
        "200": { description: Unconfirmed transaction ignored with audit reason, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/accounts:
    get:
      operationId: listFinanceAccounts
      parameters:
        - { name: unitId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Real current or recorded historical payers for the scoped unit, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
  /finance/credits:
    get:
      operationId: listAccountCredits
      responses:
        "200": { description: Available credit from immutable payments less allocations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
  /finance/credits/{id}/allocate:
    post:
      operationId: allocateAccountCredit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreditAllocationInput" } } } }
      responses:
        "200": { description: Append-only credit allocation, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /platform/operators:
    get:
      operationId: listPlatformOperators
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
  /platform/organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformOrganization
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
    patch:
      operationId: updatePlatformOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformOrganizationProfile' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/organizations/{id}/state:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformOrganizationState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformOrganizationState' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases:
    get:
      operationId: listPlatformCases
      parameters:
        - { name: queue, in: query, schema: { type: string, enum: [unassigned, mine, all], default: all } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved] } }
        - { name: priority, in: query, schema: { type: string, enum: [low, normal, high, urgent] } }
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
        - { name: overdue, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
    post:
      operationId: createPlatformCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformCase
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}/attachments/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/PlatformId' }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadPlatformCaseAttachment
      parameters:
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Explicitly shared case document; private/no-store. Unassigned ordinary support cannot download.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /platform/support-cases/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: appendPlatformCaseMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseMessage' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}/change:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseChange' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding:
    get:
      operationId: listPlatformOnboarding
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
    post:
      operationId: createPlatformOnboardingStep
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformStepInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformOnboardingStep
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding/{id}/change:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformOnboardingStep
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformStepChange' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports:
    get:
      operationId: listPlatformImports
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
  /platform/imports/preview:
    post:
      operationId: previewPlatformImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformImportInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformImport
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports/{id}/confirm:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: confirmPlatformImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformVersionIntent' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
components:
  parameters:
    PlatformId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    PlatformRecordResponse:
      description: Authorized platform record; sensitive nested records remain permission-filtered.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformRecord' }
    PlatformRecordsResponse:
      description: Authorized platform records.
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/PlatformRecord' } }
  schemas:
    SystemMetric:
      type: object
      required: [key, value, status]
      properties:
        key: {type: string}
        value: {type: [string, "null"]}
        status: {type: string, enum: [healthy, degraded, down, unavailable, not_configured]}
    SystemOverview:
      type: object
      required: [observedAt, status, metrics]
      properties:
        observedAt: {type: string}
        status: {type: string, enum: [healthy, warning, critical]}
        metrics: {type: array, items: {$ref: "#/components/schemas/SystemMetric"}}
    SystemLog:
      type: object
      required: [id, createdAt, category, level, service, event, requestId, actorId, organizationId, endpoint, method, status, latencyMs, errorCode, job]
      properties:
        id: {type: string}
        createdAt: {type: string}
        category: {type: string}
        level: {type: string}
        service: {type: string}
        event: {type: string}
        requestId: {type: [string, "null"]}
        actorId: {type: [string, "null"]}
        organizationId: {type: [string, "null"]}
        endpoint: {type: [string, "null"]}
        method: {type: [string, "null"]}
        status: {type: [integer, "null"]}
        latencyMs: {type: [integer, "null"]}
        errorCode: {type: [string, "null"]}
        job: {type: [string, "null"]}
    SystemLogs:
      type: object
      required: [page, hasMore, items]
      properties:
        page: {type: integer}
        hasMore: {type: boolean}
        items: {type: array, items: {$ref: "#/components/schemas/SystemLog"}}
    SystemJob:
      type: object
      required: [id, job, startedAt, finishedAt, heartbeatAt, status, errorCode]
      properties:
        id: {type: string}
        job: {type: string}
        startedAt: {type: string}
        finishedAt: {type: [string, "null"]}
        heartbeatAt: {type: string}
        status: {type: string, enum: [running, completed, failed, interrupted]}
        errorCode: {type: [string, "null"]}
    SystemJobs:
      type: object
      required: [page, hasMore, items]
      properties:
        page: {type: integer}
        hasMore: {type: boolean}
        items: {type: array, items: {$ref: "#/components/schemas/SystemJob"}}
    HandoverFloorReceipt:
      type: object
      required: [id]
      properties:
        id: {type: string}
    HandoverFloorInput:
      type: object
      required: [key, buildingId, entrance, number]
      properties:
        key: {type: string, format: uuid}
        buildingId: {type: string, format: uuid}
        entrance: {type: string}
        number: {type: integer, minimum: -20, maximum: 300}
    HandoverFloorAssignment:
      type: object
      required: [key, revision, floorId]
      properties:
        key: {type: string, format: uuid}
        revision: {type: integer, minimum: 0}
        floorId: {type: [string, 'null'], format: uuid}
    HandoverFloor:
      type: object
      required: [id, buildingId, entrance, number]
      properties:
        id: {type: string}
        buildingId: {type: string}
        entrance: {type: string}
        number: {type: integer}
    HandoverReadinessUnit:
      type: object
      required: [id, number, buildingId, buildingName, floorId, revision, handoverId, handoverStatus, openDefects, pendingInspections, completedInspections, status]
      properties:
        id: {type: string}
        number: {type: string}
        buildingId: {type: string}
        buildingName: {type: string}
        floorId: {type: [string, 'null']}
        revision: {type: integer}
        handoverId: {type: [string, 'null']}
        handoverStatus: {type: [string, 'null']}
        openDefects: {type: integer}
        pendingInspections: {type: integer}
        completedInspections: {type: integer}
        status: {type: string, enum: [unknown, defects, inspection, awaiting_confirmation, ready, operational]}
    HandoverReadiness:
      type: object
      required: [canManage, canCreateFloor, units, floors]
      properties:
        canManage: {type: boolean}
        canCreateFloor: {type: boolean}
        units: {type: array, items: {$ref: '#/components/schemas/HandoverReadinessUnit'}}
        floors: {type: array, items: {$ref: '#/components/schemas/HandoverFloor'}}
    UnitPlanReceipt:
      type: object
      required: [id, revision]
      properties:
        id: {type: string}
        revision: {type: integer}
    UnitPlanMarker:
      type: object
      required: [defectId, x, y]
      properties:
        defectId: {type: string}
        x: {type: number}
        y: {type: number}
    UnitPlanDefect:
      type: object
      required: [id, subject, location, status]
      properties:
        id: {type: string}
        subject: {type: string}
        location: {type: string}
        status: {type: string}
    UnitPlanCurrent:
      type: object
      required: [id, revision, createdAt, markers]
      properties:
        id: {type: string}
        revision: {type: integer}
        createdAt: {type: string}
        markers: {type: array, items: {$ref: '#/components/schemas/UnitPlanMarker'}}
    UnitPlanView:
      type: object
      required: [unitId, canManage, plan, defects]
      properties:
        unitId: {type: string}
        canManage: {type: boolean}
        plan:
          anyOf:
            - {$ref: '#/components/schemas/UnitPlanCurrent'}
            - {type: 'null'}
        defects: {type: array, items: {$ref: '#/components/schemas/UnitPlanDefect'}}
    UnitPlanChange:
      type: object
      required: [key, planId, revision, action]
      properties:
        key: {type: string, format: uuid}
        planId: {type: string, format: uuid}
        revision: {type: integer, minimum: 0}
        action: {type: string, enum: [mark, unmark, remove]}
        defectId: {type: string, format: uuid}
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
    IamAccessInput:
      type: object
      additionalProperties: false
      required: [method]
      properties:
        method: { type: string, enum: [GET, POST, PATCH, DELETE] }
        unitId: { type: string, format: uuid }
        sessionId: { type: string, pattern: '^[a-f0-9]{32}$' }
    IamRecord:
      type: object
      additionalProperties: true
    IamAccountStatusInput:
      type: object
      additionalProperties: false
      required: [status, reason]
      properties:
        status: { type: string, enum: [active, locked, disabled] }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    IamSessionRevocationInput:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 1000 }
        sessionId: { type: string, pattern: '^[a-f0-9]{32}$' }
    IamAssignmentStatusInput:
      type: object
      additionalProperties: false
      required: [version, status, reason]
      properties:
        version: { type: string }
        status: { type: string, enum: [active, suspended, revoked] }
        reason: { type: string, minLength: 5, maxLength: 1000 }
    IamProfileInput:
      type: object
      additionalProperties: false
      required: [name, baseRole, permissions]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        description: { type: string, maxLength: 1000, default: '' }
        baseRole: { type: string }
        permissions: { type: array, maxItems: 100, items: { type: string } }
        tenantAllowed: { type: boolean, default: false }
        active: { type: boolean, default: true }
        version: { type: string }
    IamAssignmentPolicyInput:
      type: object
      additionalProperties: false
      required: [version, profileId, denies, grants, reason, expiresAt]
      properties:
        version: { type: string }
