openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /invitations:
    get:
      operationId: listInvitations
      summary: List invitations in the active permission scope
      responses:
        "200":
          description: Scoped invitations; transport acceptance is not confirmed delivery
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
  /invitations/{id}/resend:
    post:
      operationId: resendInvitation
      summary: Rotate and resend an eligible invitation, optionally correcting its email
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationResendInput"
      responses:
        "200":
          description: Transport receipt, not mailbox confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSendReceipt"
        "409":
          description: Accepted or revoked invitations cannot be resent
        "503":
          description: Send failed or provider is not configured; no success receipt
  /invitations/{id}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an unaccepted invitation in the active permission scope
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found or outside the active scope
  /webhooks/resend:
    post:
      operationId: receiveResendDeliveryEvent
      summary: Receive signed delivery evidence; raw bytes must match the Svix signature
      description: Sent, delayed, delivered, bounced, complained and failed are retained. Opens and clicks are ignored. Canonical future URL https://vernatun.io/api/webhooks/resend; domain activation and live verification are pending.
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string, maxLength: 200 }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendDeliveryInput"
      responses:
        "204":
          description: Persisted, already received, or deliberately ignored event
        "400":
          description: Invalid signature, timestamp or payload
        "503":
          description: Signing secret is not configured or storage is temporarily unavailable; retry
        "413":
          description: Body exceeds 32 KiB
        "429":
          description: Rate limited; retry
        "500":
          description: Retryable persistence error
  /email-webhooks/resend:
    post:
      operationId: receiveLegacyResendDeliveryEvent
      deprecated: true
      summary: Compatibility alias; use /webhooks/resend with the same Svix headers
      responses:
        "204": { description: "Persisted, duplicate or ignored event" }
        "400": { description: Invalid signature or payload }
        "503": { description: Not configured or temporarily unavailable }
  /platform/email/health:
    get:
      operationId: getEmailHealth
      summary: Platform-admin-only email evidence and configuration health
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Configuration is not verified credentials/domain or confirmed live delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailHealth" }
        "400": { description: Invalid period; maximum 366 days }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
  /platform/email/messages:
    get:
      operationId: listEmailMessages
      summary: Platform-admin-only masked message log, server-side filters and pagination
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EmailStatus" } }
        - { name: provider, in: query, schema: { type: string, enum: [resend, smtp, outbox, disabled] } }
        - { name: businessType, in: query, schema: { $ref: "#/components/schemas/EmailBusinessType" } }
        - { name: recipient, in: query, schema: { type: string, maxLength: 254 } }
      responses:
        "200":
          description: Consistent count/page snapshot; recipients masked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailMessagePage" }
        "400": { description: Invalid filter or pagination }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
  /platform/email/messages/{id}:
    get:
      operationId: getEmailMessage
      summary: Platform-admin-only masked message and safe chronological delivery timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: No raw payload, email body, token, URL or secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailMessageDetail" }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
        "404": { description: Message not found }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /operations/categories:
    get:
      operationId: getRequestCategories
      responses:
        "200":
          description: Organization-scoped categories
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OperationalRow" } }
    post:
      operationId: createRequestCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201": { description: Category created }
  /operations/categories/{id}:
    patch:
      operationId: updateRequestCategory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdateInput" }
      responses:
        "200": { description: Category updated }
        "409": { description: Stale version }
  /operations/sla-policies:
    get:
      operationId: getSlaPolicies
      responses:
        "200":
          description: Configured organization and category priority policies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OperationalRow" } }
    post:
      operationId: saveSlaPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaPolicyInput" }
      responses:
        "200": { description: Policy saved; existing deadlines preserved }
        "409": { description: Existing policy requires matching version }
  /operations/setup:
    get:
      operationId: getDispatcherSetup
      parameters:
        - { name: buildingId, in: query, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Scoped buildings units residents technicians
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
  /requests:
    get:
      operationId: getOperationalRequests
      responses:
        "200":
          description: Existing authorized array enriched with priority and backend SLA
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OperationalRow" } }
    post:
      operationId: createOperationalRequest
      description: Source is derived server-side. Enhanced staff requests require category and idempotency key. Legacy resident inputs stay compatible.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalRequestInput" }
      responses:
        "201":
          description: Created or same idempotent result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
        "403": { description: Invalid assignment resident or permission }
        "409": { description: Idempotency conflict }
  /requests/{id}:
    get:
      operationId: getOperationalRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Existing detail with SLA visits history materials and typed photos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
        "404": { description: No authorized request }
  /requests/{id}/transition:
    post:
      operationId: transitionOperationalRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkTransitionInput" }
      responses:
        "200": { description: Authorized versioned transition or original receipt }
        "409": { description: Stale version or illegal transition }
  /requests/{id}/visits:
    post:
      operationId: proposeRequestVisit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitProposalInput" }
      responses:
        "200": { description: Proposed or rescheduled visit; previous visit retained }
  /requests/{id}/visits/{visitId}:
    post:
      operationId: respondToRequestVisit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: visitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitResponseInput" }
      responses:
        "200": { description: Independent resident or assigned technician response }
  /requests/{id}/materials:
    post:
      operationId: addWorkMaterial
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialInput" }
      responses:
        "201": { description: Recorded without creating financial transaction }
  /auth/reauthenticate:
    post:
      operationId: reauthenticateResident
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecentAuthenticationInput" }
      responses:
        "200": { description: Password and configured MFA verified; five minute sensitive-action window }
  /delegations:
    post:
      operationId: createResidentDelegation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResidentDelegationInput" }
      responses:
        "201": { description: Separate pending family invitation; email acceptance is not delivery }
  /delegations/{id}/expiration:
    post:
      operationId: changeDelegationExpiration
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegationExpirationInput" }
      responses:
        "200": { description: Owner-authorized versioned expiration update }
  /delegations/{id}/resend:
    post:
      operationId: resendResidentDelegation
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DelegationResendInput" }
      responses:
        "200": { description: Pending invitation rotated and submitted to existing provider }
  /leases/{id}/{action}:
    post:
      operationId: transitionResidentLease
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [extend, cancel] } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeaseLifecycleInput" }
      responses:
        "200": { description: Versioned lease with centralized access policy }
  /notifications/{id}/destination:
    get:
      operationId: resolveNotificationDestination
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: contextId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized destination suggestion without switching or merging permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationDestination" }
        "403": { description: No current authorized assignment for this request }
  /maintenance:
    post:
      operationId: createMaintenancePlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenancePlanInput" }
      responses:
        "201":
          description: Saved inactive or explicitly activated maintenance plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecord" }
  /maintenance/{id}/configure:
    post:
      operationId: configureMaintenancePlan
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceConfigurationInput" }
      responses:
        "200":
          description: Versioned active and automatic generation configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecord" }
  /maintenance/{id}/generate:
    post:
      operationId: generateMaintenanceEvent
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaintenanceGenerationInput" }
      responses:
        "200":
          description: Existing or newly generated due event with linked request and work order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MaintenanceRecord" }
  /maintenance/{id}/events:
    get:
      operationId: getMaintenanceEvents
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Authorized equipment maintenance history
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MaintenanceRecord" }
  /assets/lookup:
    get:
      operationId: lookupEquipment
      parameters:
        - { name: identifier, in: query, required: true, schema: { type: string, maxLength: 160 } }
      responses:
        "200":
          description: Scoped asset plans work history and unit identifiers; identifier never grants access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
        "404": { description: Asset not in authorized scope }
  /incidents/{id}:
    get:
      operationId: getOperationalIncident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Scoped incident with append-only history and private attachments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
  /incidents/{id}/transition:
    post:
      operationId: transitionIncident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentTransitionInput" }
      responses:
        "200": { description: Incident transitioned with historical snapshot }
  /operations/visits:
    get:
      operationId: listOperationalVisits
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Active visits in a bounded date range and the current request scope
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OperationalRow"}}
  /assets/{id}/qr:
    get:
      operationId: getAssetQr
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: QR encodes an identifier, never an authorization grant
          content:
            image/png:
              schema: {type: string, format: binary}
  /requests/{id}/photos:
    post:
      operationId: uploadOperationalPhoto
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: photoType, in: query, schema: {type: string, enum: [before, during, after, evidence]}}
        - {name: X-Operation-Key, in: header, schema: {type: string, format: uuid}}
        - {name: X-Work-Version, in: header, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {$ref: "#/components/schemas/PrivateImageInput"}
      responses:
        "201":
          description: Sanitized private photo metadata; stable operation key permits safe retry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incidents:
    get:
      operationId: listOperationalIncidents
      responses:
        "200":
          description: Incident list within current organization/building/unit scope
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OperationalRow"}}
    post:
      operationId: createOperationalIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IncidentInput"}
      responses:
        "201":
          description: Created incident with append-only history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incidents/{id}/attachments:
    post:
      operationId: uploadIncidentEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Operation-Key, in: header, schema: {type: string, format: uuid}}
        - {name: X-Work-Version, in: header, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {$ref: "#/components/schemas/PrivateImageInput"}
      responses:
        "201":
          description: Sanitized private incident evidence metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incident-attachments/{id}:
    get:
      operationId: getIncidentEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Private image after fresh incident authorization
          content:
            image/jpeg:
              schema: {type: string, format: binary}
  /finance/batches/preview:
    post:
      operationId: previewBillingBatch
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingBatchInput" } } } }
      responses:
        "200": { description: Scoped calculation without ledger writes, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/batches:
    get:
      operationId: listBillingBatches
      responses:
        "200": { description: Scoped batches, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
    post:
      operationId: createBillingDraft
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingDraftInput" } } } }
      responses:
        "201": { description: Frozen draft without invoices, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/batches/{id}/{action}:
    post:
      operationId: transitionBillingBatch
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: action, in: path, required: true, schema: { type: string, enum: [publish, cancel] } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BillingPublicationInput" } } } }
      responses:
        "200": { description: Atomic publication or draft cancellation, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/bank/imports/preview:
    post:
      operationId: previewBankImport
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BankImportInput" } } } }
      responses:
        "200": { description: Import validation and duplicate/conflict evidence, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/bank/imports:
    get:
      operationId: listBankImports
      responses:
        "200": { description: Imported statement metadata, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
    post:
      operationId: commitBankImport
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BankImportInput" } } } }
      responses:
        "201": { description: Atomic import only; no payments confirmed, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/bank/transactions:
    get:
      operationId: listBankTransactions
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 100 } }
        - { name: status, in: query, schema: { type: string, enum: [matched, partially_matched, unmatched, ignored] } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        "200": { description: Transactions with current allocation status, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
  /finance/bank/transactions/{id}/suggestions:
    get:
      operationId: suggestBankMatches
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, schema: { type: string, format: uuid } }
        - { name: payerId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Suggestions never automatically confirm money, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
  /finance/bank/transactions/{id}/confirm:
    post:
      operationId: confirmBankTransaction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BankConfirmationInput" } } } }
      responses:
        "200": { description: "Payment, allocations and unit-account credit in one transaction", content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/bank/transactions/{id}/ignore:
    post:
      operationId: ignoreBankTransaction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BankIgnoreInput" } } } }
      responses:
        "200": { description: Unconfirmed transaction ignored with audit reason, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /finance/accounts:
    get:
      operationId: listFinanceAccounts
      parameters:
        - { name: unitId, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Real current or recorded historical payers for the scoped unit, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
  /finance/credits:
    get:
      operationId: listAccountCredits
      responses:
        "200": { description: Available credit from immutable payments less allocations, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/FinanceRecord" } } } } }
  /finance/credits/{id}/allocate:
    post:
      operationId: allocateAccountCredit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CreditAllocationInput" } } } }
      responses:
        "200": { description: Append-only credit allocation, content: { application/json: { schema: { $ref: "#/components/schemas/FinanceRecord" } } } }
  /platform/operators:
    get:
      operationId: listPlatformOperators
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
  /platform/organizations/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformOrganization
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
    patch:
      operationId: updatePlatformOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformOrganizationProfile' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/organizations/{id}/state:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformOrganizationState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformOrganizationState' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases:
    get:
      operationId: listPlatformCases
      parameters:
        - { name: queue, in: query, schema: { type: string, enum: [unassigned, mine, all], default: all } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved] } }
        - { name: priority, in: query, schema: { type: string, enum: [low, normal, high, urgent] } }
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
        - { name: overdue, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
    post:
      operationId: createPlatformCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformCase
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}/attachments/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/PlatformId' }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadPlatformCaseAttachment
      responses:
        '200':
          description: Explicitly shared case document; private/no-store. Unassigned ordinary support cannot download.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /platform/support-cases/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: appendPlatformCaseMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseMessage' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}/change:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseChange' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding:
    get:
      operationId: listPlatformOnboarding
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
    post:
      operationId: createPlatformOnboardingStep
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformStepInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformOnboardingStep
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding/{id}/change:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformOnboardingStep
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformStepChange' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports:
    get:
      operationId: listPlatformImports
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
  /platform/imports/preview:
    post:
      operationId: previewPlatformImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformImportInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformImport
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports/{id}/confirm:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: confirmPlatformImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformVersionIntent' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
components:
  parameters:
    PlatformId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    PlatformRecordResponse:
      description: Authorized platform record; sensitive nested records remain permission-filtered.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformRecord' }
    PlatformRecordsResponse:
      description: Authorized platform records.
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/PlatformRecord' } }
  schemas:
    PlatformRecord:
      type: object
      additionalProperties: true
    PlatformVersionIntent:
      type: object
      required: [key, version]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
    PlatformOrganizationProfile:
      type: object
      required: [key, version, name, legalName, taxId, address, contactEmail, contactPhone, timezone, currency, defaultLanguage]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 200 }
        legalName: { type: string, maxLength: 200 }
        taxId: { type: string, maxLength: 80 }
        address: { type: string, maxLength: 500 }
        contactEmail: { type: string }
        contactPhone: { type: string, maxLength: 80 }
        timezone: { type: string, maxLength: 100 }
        currency: { type: string, enum: [AMD, RUB, USD] }
        defaultLanguage: { type: string, enum: [hy, ru, en] }
    PlatformOrganizationState:
      type: object
      required: [key, version, status, reason]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [active, suspended, archived] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    PlatformCaseInput:
      type: object
      required: [key, subject, body]
      properties:
        key: { type: string, format: uuid }
        subject: { type: string, minLength: 2, maxLength: 200 }
        body: { type: string, minLength: 1, maxLength: 8000 }
        priority: { type: string, enum: [low, normal, high, urgent], default: normal }
        category: { type: string, default: general }
        attachmentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
    PlatformCaseMessage:
      type: object
      required: [key, version, body]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        body: { type: string, minLength: 1, maxLength: 8000 }
        internal: { type: boolean, default: false }
        attachmentIds: { type: array, maxItems: 10, items: { type: string, format: uuid } }
    PlatformCaseChange:
      type: object
      required: [key, version]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        assigneeId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [open, in_progress, resolved] }
        priority: { type: string, enum: [low, normal, high, urgent] }
        category: { type: string }
    PlatformStepInput:
      type: object
      required: [key, organizationId, title, assigneeId, dueOn, order]
      properties:
        key: { type: string, format: uuid }
        organizationId: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 200 }
        category: { type: string, default: general }
        assigneeId: { type: string, format: uuid }
        dueOn: { type: string, format: date }
        order: { type: integer, minimum: 0, maximum: 100000 }
        dependencies: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
        notes: { type: string, maxLength: 8000 }
    PlatformStepChange:
      type: object
      required: [key, version, action]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        action: { type: string, enum: [edit, assign, start, complete, reopen] }
        assigneeId: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 200 }
        category: { type: string }
        dueOn: { type: string, format: date }
        order: { type: integer, minimum: 0, maximum: 100000 }
        dependencies: { type: array, maxItems: 100, uniqueItems: true, items: { type: string, format: uuid } }
        notes: { type: string, maxLength: 8000 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
        reopenDependents: { type: boolean, default: false }
    PlatformImportInput:
      type: object
      required: [key, buildingId, entityType, rows]
      properties:
        key: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        entityType: { type: string, enum: [units, owners, residents, meters, opening_balances] }
        rows:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            type: object
            additionalProperties: { type: string, maxLength: 1000 }
    FinanceRecord:
      type: object
      additionalProperties: true
    BillingBatchInput:
      type: object
      required: [buildingId, period, tariffId]
      properties:
        buildingId: { type: string, format: uuid }
        period: { type: string, format: date }
        tariffId: { type: string, format: uuid }
    BillingDraftInput:
      allOf:
        - { $ref: "#/components/schemas/BillingBatchInput" }
        - type: object
          required: [key]
          properties:
            key: { type: string, format: uuid }
    BillingPublicationInput:
      type: object
      required: [key, version]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        acceptWarnings: { type: boolean, default: false }
    BankEntryInput:
      type: object
      required: [externalId, date, amountMinor, currency, payerText, purpose]
      properties:
        externalId: { type: string, minLength: 1, maxLength: 160 }
        date: { type: string, format: date }
        amountMinor: { type: string, pattern: "^-?[1-9][0-9]{0,13}$" }
        currency: { type: string, enum: [AMD, RUB, USD] }
        payerText: { type: string, maxLength: 200 }
        purpose: { type: string, maxLength: 1000 }
        rawPayload: { type: object, additionalProperties: { type: string } }
    BankImportInput:
      type: object
      required: [key, account, transactions]
      properties:
        key: { type: string, format: uuid }
        account: { type: string, minLength: 2, maxLength: 160 }
        transactions: { type: array, minItems: 1, maxItems: 1000, items: { $ref: "#/components/schemas/BankEntryInput" } }
    InvoiceAllocationInput:
      type: object
      required: [invoiceId, amountMinor]
      properties:
        invoiceId: { type: string, format: uuid }
        amountMinor: { type: string, pattern: "^[1-9][0-9]{0,13}$" }
    BankConfirmationInput:
      type: object
      required: [key, version, unitId, payerId, allocations]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        unitId: { type: string, format: uuid }
        payerId: { type: string, format: uuid }
        allocations: { type: array, maxItems: 100, items: { $ref: "#/components/schemas/InvoiceAllocationInput" } }
    BankIgnoreInput:
      type: object
      required: [key, version, reason]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    CreditAllocationInput:
      type: object
      required: [key, allocations]
      properties:
        key: { type: string, format: uuid }
        allocations: { type: array, minItems: 1, maxItems: 100, items: { $ref: "#/components/schemas/InvoiceAllocationInput" } }
    RecentAuthenticationInput:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 1, maxLength: 72 }
        code: { type: string, minLength: 6, maxLength: 30 }
    ResidentDelegationInput:
      type: object
      required: [email, expiresAt, permissions]
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        expiresAt: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string, enum: [requests.own, requests.create, announcements.read, properties.own, access.create] }
    DelegationExpirationInput:
      type: object
      required: [version, expiresAt]
      properties:
        version: { type: integer, minimum: 1 }
        expiresAt: { type: string, format: date-time }
    DelegationResendInput:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    LeaseLifecycleInput:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
        endsOn: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    NotificationDestination:
      type: object
      required: [targetContextId, requiresSwitch, destination]
      properties:
        targetContextId: { type: string, format: uuid }
        requiresSwitch: { type: boolean }
        destination: { type: string }
    MaintenanceRecord:
      type: object
      required: [id]
      properties:
        id: { type: string, format: uuid }
      additionalProperties: true
    MaintenancePlanInput:
      type: object
      required: [assetId, title, dueOn, categoryId]
      additionalProperties: false
      properties:
        assetId: { type: string, format: uuid }
        title: { type: string, minLength: 2, maxLength: 160 }
        dueOn: { type: string, format: date }
        frequency: { type: string, enum: [once, daily, weekly, monthly, quarterly, semiannual, annual, custom], default: once }
        intervalDays: { type: [integer, "null"], minimum: 1, maximum: 36600 }
        categoryId: { type: string, format: uuid }
        priority: { type: string, enum: [low, normal, high, urgent, emergency], default: normal }
        instructions: { type: string, maxLength: 4000 }
        checklist:
          type: array
          maxItems: 30
          items: { type: string, minLength: 1, maxLength: 200 }
        active: { type: boolean, default: false }
        automatic: { type: boolean, default: false }
    MaintenanceConfigurationInput:
      type: object
      required: [version, active, automatic]
      additionalProperties: false
      properties:
        version: { type: integer, minimum: 1 }
        active: { type: boolean }
        automatic: { type: boolean }
        categoryId: { type: string, format: uuid }
    MaintenanceGenerationInput:
      type: object
      additionalProperties: false
      properties:
        cycleNo: { type: integer, minimum: 0 }
    PrivateImageInput:
      description: Opaque binary image carried as application/octet-stream; decoded and validated on the server.
    IncidentInput:
      type: object
      additionalProperties: false
      required: [buildingId, description]
      properties:
        key: {type: string, format: uuid}
        buildingId: {type: string, format: uuid}
        description: {type: string, minLength: 3, maxLength: 4000}
        severity: {type: string, enum: [low, normal, high, critical]}
    CategoryInput:
      type: object
      required: [key, name]
      properties:
        key: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 160 }
    CategoryUpdateInput:
      type: object
      required: [version, name, active]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 160 }
        active: { type: boolean }
    SlaPolicyInput:
      type: object
      required: [categoryId, priority, responseMinutes, assignmentMinutes, arrivalMinutes, resolutionMinutes, pauseResolution]
      properties:
        categoryId: { type: [string, "null"], format: uuid }
        priority: { $ref: "#/components/schemas/RequestPriority" }
        responseMinutes: { type: integer, minimum: 1, maximum: 43200 }
        assignmentMinutes: { type: integer, minimum: 1, maximum: 43200 }
        arrivalMinutes: { type: integer, minimum: 1, maximum: 43200 }
        resolutionMinutes: { type: integer, minimum: 1, maximum: 43200 }
        pauseResolution: { type: boolean }
        version: { type: integer, minimum: 1 }
    OperationalRequestInput:
      type: object
      required: [unitId, subject]
      additionalProperties: false
      properties:
        key: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        subject: { type: string, minLength: 3, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        categoryId: { type: string, format: uuid }
        priority: { $ref: "#/components/schemas/RequestPriority" }
        reportedForUserId: { type: string, format: uuid }
        contactMethod: { type: string, enum: [app, phone, email, none] }
        preferredVisitStart: { type: string, format: date-time }
        preferredVisitEnd: { type: string, format: date-time }
        technicianId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
    WorkTransitionInput:
      type: object
      required: [action, version]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        action: { type: string, enum: [assign, start, report, approve, reject, confirm, reopen, accept, cannot_perform, pause, resume] }
        technicianId: { type: string, format: uuid }
        note: { type: string, maxLength: 4000 }
        reason: { type: string, enum: [resident_unavailable, no_access, missing_material, requires_specialist, unsafe_condition, wrong_category, other] }
        checklist:
          type: array
          maxItems: 30
          items:
            type: object
            required: [text, done]
            properties:
              text: { type: string, maxLength: 200 }
              done: { type: boolean }
    VisitProposalInput:
      type: object
      required: [key, version, startsAt, endsAt]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    VisitResponseInput:
      type: object
      required: [key, version, visitVersion, action]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        visitVersion: { type: integer, minimum: 1 }
        action: { type: string, enum: [confirm, cancel, request_another_time] }
        note: { type: string, maxLength: 4000 }
        suggestedStart: { type: string, format: date-time }
        suggestedEnd: { type: string, format: date-time }
    MaterialInput:
      type: object
      required: [key, version, kind, name, quantity, unit]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [material, service] }
        name: { type: string, maxLength: 160 }
        quantity: { type: number, minimum: 0.001 }
        unit: { type: string, maxLength: 30 }
        unitCostMinor: { type: integer, minimum: 0 }
        comment: { type: string, maxLength: 1000 }
    IncidentTransitionInput:
      type: object
      required: [key, version, status, note]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [open, investigating, resolved, closed] }
        severity: { type: string, enum: [low, normal, high, critical] }
        note: { type: string, minLength: 3, maxLength: 4000 }
    OperationalRow:
      type: object
      additionalProperties: true
    RequestPriority:
      type: string
      enum: [low, normal, high, urgent, emergency]
    EmailStatus:
      type: string
      enum: [unknown, local, accepted, sent, delayed, delivered, bounced, complained, failed]
    EmailBusinessType:
      type: string
      enum: [invitation, password_reset, delegation, notification, platform_invoice, support, other]
    EmailMessage:
      type: object
      required: [id, business_type, provider, recipient_masked, status, created_at]
      properties:
        id: { type: string, format: uuid }
        business_type: { $ref: "#/components/schemas/EmailBusinessType" }
        business_id: { type: [string, "null"], format: uuid }
        provider: { type: string }
        provider_scope: { type: string }
        recipient_masked: { type: string }
        provider_message_id_short: { type: [string, "null"] }
        sender: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EmailStatus" }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time }
    EmailMessagePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EmailMessage" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    EmailMessageDetail:
      type: object
      required: [message, events]
      properties:
        message: { $ref: "#/components/schemas/EmailMessage" }
        events:
          type: array
          items:
            type: object
            required: [event_type, outcome, occurred_at, received_at, safe_metadata]
            properties:
              event_type: { type: string }
              outcome: { $ref: "#/components/schemas/EmailStatus" }
              occurred_at: { type: string, format: date-time }
              received_at: { type: string, format: date-time }
              safe_metadata: { type: object, additionalProperties: { type: string } }
    EmailHealth:
      type: object
      required: [provider, providerStatus, sender, period, counts, deliveryRate, webhook, liveVerification]
      properties:
        provider: { type: string }
        providerStatus: { type: string, enum: [configured_unverified, not_configured] }
        sender: { type: [string, "null"] }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        counts: { type: object, additionalProperties: { type: integer } }
        deliveryRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Fraction of accepted-send cohort currently in delivered aggregate status; excludes local and unknown
        lastAccepted: { type: [string, "null"], format: date-time }
        lastDelivered: { type: [string, "null"], format: date-time }
        lastBounce: { type: [string, "null"], format: date-time }
        lastComplaint: { type: [string, "null"], format: date-time }
        lastFailure: { type: [string, "null"], format: date-time }
        liveVerification: { type: string, enum: [not_performed] }
        webhook:
          type: object
          required: [configured, signatureVerificationReady, recentFailures]
          properties:
            configured: { type: boolean }
            signatureVerificationReady: { type: boolean }
            lastEventReceived: { type: [string, "null"], format: date-time }
            lastValidEvent: { type: [string, "null"], format: date-time }
            lastInvalidSignature: { type: [string, "null"], format: date-time }
            recentFailures: { type: integer }
    Invitation:
      type: object
      required: [id, email, role_key, organization_id, organization_name, expires_at, status, email_delivery_status, delivery_outcome, delivery_evidence]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role_key: { type: string }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        delegation_id: { type: [string, "null"], format: uuid }
        status:
          type: string
          enum: [pending, expired, accepted, revoked]
        email_delivery_status:
          type: string
          enum: [unknown, local, sent, failed]
        email_delivery_at: { type: [string, "null"], format: date-time }
