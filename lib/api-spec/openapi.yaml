openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /invitations:
    get:
      operationId: listInvitations
      summary: List invitations in the active permission scope
      responses:
        "200":
          description: Scoped invitations; transport acceptance is not confirmed delivery
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
  /invitations/{id}/resend:
    post:
      operationId: resendInvitation
      summary: Rotate and resend an eligible invitation, optionally correcting its email
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationResendInput"
      responses:
        "200":
          description: Transport receipt, not mailbox confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSendReceipt"
        "409":
          description: Accepted or revoked invitations cannot be resent
        "503":
          description: Send failed or provider is not configured; no success receipt
  /invitations/{id}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an unaccepted invitation in the active permission scope
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Revoked
        "404":
          description: Not found or outside the active scope
  /webhooks/resend:
    post:
      operationId: receiveResendDeliveryEvent
      summary: Receive signed delivery evidence; raw bytes must match the Svix signature
      description: Sent, delayed, delivered, bounced, complained and failed are retained. Opens and clicks are ignored. Canonical future URL https://vernatun.io/api/webhooks/resend; domain activation and live verification are pending.
      parameters:
        - name: svix-id
          in: header
          required: true
          schema: { type: string, maxLength: 200 }
        - name: svix-timestamp
          in: header
          required: true
          schema: { type: string }
        - name: svix-signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendDeliveryInput"
      responses:
        "204":
          description: Persisted, already received, or deliberately ignored event
        "400":
          description: Invalid signature, timestamp or payload
        "503":
          description: Signing secret is not configured or storage is temporarily unavailable; retry
        "413":
          description: Body exceeds 32 KiB
        "429":
          description: Rate limited; retry
        "500":
          description: Retryable persistence error
  /email-webhooks/resend:
    post:
      operationId: receiveLegacyResendDeliveryEvent
      deprecated: true
      summary: Compatibility alias; use /webhooks/resend with the same Svix headers
      responses:
        "204": { description: "Persisted, duplicate or ignored event" }
        "400": { description: Invalid signature or payload }
        "503": { description: Not configured or temporarily unavailable }
  /platform/email/health:
    get:
      operationId: getEmailHealth
      summary: Platform-admin-only email evidence and configuration health
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200":
          description: Configuration is not verified credentials/domain or confirmed live delivery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailHealth" }
        "400": { description: Invalid period; maximum 366 days }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
  /platform/email/messages:
    get:
      operationId: listEmailMessages
      summary: Platform-admin-only masked message log, server-side filters and pagination
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 100000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/EmailStatus" } }
        - { name: provider, in: query, schema: { type: string, enum: [resend, smtp, outbox, disabled] } }
        - { name: businessType, in: query, schema: { $ref: "#/components/schemas/EmailBusinessType" } }
        - { name: recipient, in: query, schema: { type: string, maxLength: 254 } }
      responses:
        "200":
          description: Consistent count/page snapshot; recipients masked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailMessagePage" }
        "400": { description: Invalid filter or pagination }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
  /platform/email/messages/{id}:
    get:
      operationId: getEmailMessage
      summary: Platform-admin-only masked message and safe chronological delivery timeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: No raw payload, email body, token, URL or secret
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmailMessageDetail" }
        "401": { description: Sign-in required }
        "403": { description: Platform administrator context required }
        "404": { description: Message not found }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /operations/categories:
    get:
      operationId: getRequestCategories
      responses:
        "200":
          description: Organization-scoped categories
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OperationalRow" } }
    post:
      operationId: createRequestCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryInput" }
      responses:
        "201": { description: Category created }
  /operations/categories/{id}:
    patch:
      operationId: updateRequestCategory
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryUpdateInput" }
      responses:
        "200": { description: Category updated }
        "409": { description: Stale version }
  /operations/sla-policies:
    get:
      operationId: getSlaPolicies
      responses:
        "200":
          description: Configured organization and category priority policies
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OperationalRow" } }
    post:
      operationId: saveSlaPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SlaPolicyInput" }
      responses:
        "200": { description: Policy saved; existing deadlines preserved }
        "409": { description: Existing policy requires matching version }
  /operations/setup:
    get:
      operationId: getDispatcherSetup
      parameters:
        - { name: buildingId, in: query, schema: { type: string, format: uuid } }
        - { name: unitId, in: query, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Scoped buildings units residents technicians
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
  /requests:
    get:
      operationId: getOperationalRequests
      responses:
        "200":
          description: Existing authorized array enriched with priority and backend SLA
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OperationalRow" } }
    post:
      operationId: createOperationalRequest
      description: Source is derived server-side. Enhanced staff requests require category and idempotency key. Legacy resident inputs stay compatible.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationalRequestInput" }
      responses:
        "201":
          description: Created or same idempotent result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
        "403": { description: Invalid assignment resident or permission }
        "409": { description: Idempotency conflict }
  /requests/{id}:
    get:
      operationId: getOperationalRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Existing detail with SLA visits history materials and typed photos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
        "404": { description: No authorized request }
  /requests/{id}/transition:
    post:
      operationId: transitionOperationalRequest
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkTransitionInput" }
      responses:
        "200": { description: Authorized versioned transition or original receipt }
        "409": { description: Stale version or illegal transition }
  /requests/{id}/visits:
    post:
      operationId: proposeRequestVisit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitProposalInput" }
      responses:
        "200": { description: Proposed or rescheduled visit; previous visit retained }
  /requests/{id}/visits/{visitId}:
    post:
      operationId: respondToRequestVisit
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: visitId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitResponseInput" }
      responses:
        "200": { description: Independent resident or assigned technician response }
  /requests/{id}/materials:
    post:
      operationId: addWorkMaterial
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MaterialInput" }
      responses:
        "201": { description: Recorded without creating financial transaction }
  /assets/lookup:
    get:
      operationId: lookupEquipment
      parameters:
        - { name: identifier, in: query, required: true, schema: { type: string, maxLength: 160 } }
      responses:
        "200":
          description: Scoped asset plans work history and unit identifiers; identifier never grants access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
        "404": { description: Asset not in authorized scope }
  /incidents/{id}:
    get:
      operationId: getOperationalIncident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Scoped incident with append-only history and private attachments
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationalRow" }
  /incidents/{id}/transition:
    post:
      operationId: transitionIncident
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IncidentTransitionInput" }
      responses:
        "200": { description: Incident transitioned with historical snapshot }
  /operations/visits:
    get:
      operationId: listOperationalVisits
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date-time}}
        - {name: to, in: query, required: true, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: Active visits in a bounded date range and the current request scope
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OperationalRow"}}
  /assets/{id}/qr:
    get:
      operationId: getAssetQr
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: QR encodes an identifier, never an authorization grant
          content:
            image/png:
              schema: {type: string, format: binary}
  /requests/{id}/photos:
    post:
      operationId: uploadOperationalPhoto
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: photoType, in: query, schema: {type: string, enum: [before, during, after, evidence]}}
        - {name: X-Operation-Key, in: header, schema: {type: string, format: uuid}}
        - {name: X-Work-Version, in: header, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {$ref: "#/components/schemas/PrivateImageInput"}
      responses:
        "201":
          description: Sanitized private photo metadata; stable operation key permits safe retry
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incidents:
    get:
      operationId: listOperationalIncidents
      responses:
        "200":
          description: Incident list within current organization/building/unit scope
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/OperationalRow"}}
    post:
      operationId: createOperationalIncident
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IncidentInput"}
      responses:
        "201":
          description: Created incident with append-only history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incidents/{id}/attachments:
    post:
      operationId: uploadIncidentEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: X-Operation-Key, in: header, schema: {type: string, format: uuid}}
        - {name: X-Work-Version, in: header, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {$ref: "#/components/schemas/PrivateImageInput"}
      responses:
        "201":
          description: Sanitized private incident evidence metadata
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OperationalRow"}
  /incident-attachments/{id}:
    get:
      operationId: getIncidentEvidence
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Private image after fresh incident authorization
          content:
            image/jpeg:
              schema: {type: string, format: binary}
components:
  schemas:
    PrivateImageInput:
      description: Opaque binary image carried as application/octet-stream; decoded and validated on the server.
    IncidentInput:
      type: object
      additionalProperties: false
      required: [buildingId, description]
      properties:
        key: {type: string, format: uuid}
        buildingId: {type: string, format: uuid}
        description: {type: string, minLength: 3, maxLength: 4000}
        severity: {type: string, enum: [low, normal, high, critical]}
    CategoryInput:
      type: object
      required: [key, name]
      properties:
        key: { type: string, maxLength: 60 }
        name: { type: string, maxLength: 160 }
    CategoryUpdateInput:
      type: object
      required: [version, name, active]
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, maxLength: 160 }
        active: { type: boolean }
    SlaPolicyInput:
      type: object
      required: [categoryId, priority, responseMinutes, assignmentMinutes, arrivalMinutes, resolutionMinutes, pauseResolution]
      properties:
        categoryId: { type: [string, "null"], format: uuid }
        priority: { $ref: "#/components/schemas/RequestPriority" }
        responseMinutes: { type: integer, minimum: 1, maximum: 43200 }
        assignmentMinutes: { type: integer, minimum: 1, maximum: 43200 }
        arrivalMinutes: { type: integer, minimum: 1, maximum: 43200 }
        resolutionMinutes: { type: integer, minimum: 1, maximum: 43200 }
        pauseResolution: { type: boolean }
        version: { type: integer, minimum: 1 }
    OperationalRequestInput:
      type: object
      required: [unitId, subject]
      additionalProperties: false
      properties:
        key: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        subject: { type: string, minLength: 3, maxLength: 160 }
        description: { type: string, maxLength: 4000 }
        categoryId: { type: string, format: uuid }
        priority: { $ref: "#/components/schemas/RequestPriority" }
        reportedForUserId: { type: string, format: uuid }
        contactMethod: { type: string, enum: [app, phone, email, none] }
        preferredVisitStart: { type: string, format: date-time }
        preferredVisitEnd: { type: string, format: date-time }
        technicianId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
    WorkTransitionInput:
      type: object
      required: [action, version]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        action: { type: string, enum: [assign, start, report, approve, reject, confirm, reopen, accept, cannot_perform, pause, resume] }
        technicianId: { type: string, format: uuid }
        note: { type: string, maxLength: 4000 }
        reason: { type: string, enum: [resident_unavailable, no_access, missing_material, requires_specialist, unsafe_condition, wrong_category, other] }
        checklist:
          type: array
          maxItems: 30
          items:
            type: object
            required: [text, done]
            properties:
              text: { type: string, maxLength: 200 }
              done: { type: boolean }
    VisitProposalInput:
      type: object
      required: [key, version, startsAt, endsAt]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    VisitResponseInput:
      type: object
      required: [key, version, visitVersion, action]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        visitVersion: { type: integer, minimum: 1 }
        action: { type: string, enum: [confirm, cancel] }
        note: { type: string, maxLength: 4000 }
    MaterialInput:
      type: object
      required: [key, version, kind, name, quantity, unit]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        kind: { type: string, enum: [material, service] }
        name: { type: string, maxLength: 160 }
        quantity: { type: number, minimum: 0.001 }
        unit: { type: string, maxLength: 30 }
        unitCostMinor: { type: integer, minimum: 0 }
        comment: { type: string, maxLength: 1000 }
    IncidentTransitionInput:
      type: object
      required: [key, version, status, note]
      properties:
        key: { type: string, format: uuid }
        version: { type: integer, minimum: 1 }
        status: { type: string, enum: [open, investigating, resolved, closed] }
        severity: { type: string, enum: [low, normal, high, critical] }
        note: { type: string, minLength: 3, maxLength: 4000 }
    OperationalRow:
      type: object
      additionalProperties: true
    RequestPriority:
      type: string
      enum: [low, normal, high, urgent, emergency]
    EmailStatus:
      type: string
      enum: [unknown, local, accepted, sent, delayed, delivered, bounced, complained, failed]
    EmailBusinessType:
      type: string
      enum: [invitation, password_reset, delegation, notification, platform_invoice, support, other]
    EmailMessage:
      type: object
      required: [id, business_type, provider, recipient_masked, status, created_at]
      properties:
        id: { type: string, format: uuid }
        business_type: { $ref: "#/components/schemas/EmailBusinessType" }
        business_id: { type: [string, "null"], format: uuid }
        provider: { type: string }
        provider_scope: { type: string }
        recipient_masked: { type: string }
        provider_message_id_short: { type: [string, "null"] }
        sender: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/EmailStatus" }
        created_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        last_event_at: { type: [string, "null"], format: date-time }
    EmailMessagePage:
      type: object
      required: [items, total, page, pageSize]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/EmailMessage" } }
        total: { type: integer }
        page: { type: integer }
        pageSize: { type: integer }
    EmailMessageDetail:
      type: object
      required: [message, events]
      properties:
        message: { $ref: "#/components/schemas/EmailMessage" }
        events:
          type: array
          items:
            type: object
            required: [event_type, outcome, occurred_at, received_at, safe_metadata]
            properties:
              event_type: { type: string }
              outcome: { $ref: "#/components/schemas/EmailStatus" }
              occurred_at: { type: string, format: date-time }
              received_at: { type: string, format: date-time }
              safe_metadata: { type: object, additionalProperties: { type: string } }
    EmailHealth:
      type: object
      required: [provider, providerStatus, sender, period, counts, deliveryRate, webhook, liveVerification]
      properties:
        provider: { type: string }
        providerStatus: { type: string, enum: [configured_unverified, not_configured] }
        sender: { type: [string, "null"] }
        period:
          type: object
          required: [from, to]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
        counts: { type: object, additionalProperties: { type: integer } }
        deliveryRate:
          type: [number, "null"]
          minimum: 0
          maximum: 1
          description: Fraction of accepted-send cohort currently in delivered aggregate status; excludes local and unknown
        lastAccepted: { type: [string, "null"], format: date-time }
        lastDelivered: { type: [string, "null"], format: date-time }
        lastBounce: { type: [string, "null"], format: date-time }
        lastComplaint: { type: [string, "null"], format: date-time }
        lastFailure: { type: [string, "null"], format: date-time }
        liveVerification: { type: string, enum: [not_performed] }
        webhook:
          type: object
          required: [configured, signatureVerificationReady, recentFailures]
          properties:
            configured: { type: boolean }
            signatureVerificationReady: { type: boolean }
            lastEventReceived: { type: [string, "null"], format: date-time }
            lastValidEvent: { type: [string, "null"], format: date-time }
            lastInvalidSignature: { type: [string, "null"], format: date-time }
            recentFailures: { type: integer }
    Invitation:
      type: object
      required: [id, email, role_key, organization_id, organization_name, expires_at, status, email_delivery_status, delivery_outcome, delivery_evidence]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role_key: { type: string }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string }
        expires_at: { type: string, format: date-time }
        accepted_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        delegation_id: { type: [string, "null"], format: uuid }
        status:
          type: string
          enum: [pending, expired, accepted, revoked]
        email_delivery_status:
          type: string
          enum: [unknown, local, sent, failed]
        email_delivery_at: { type: [string, "null"], format: date-time }
        delivery_outcome:
          type: string
          enum: [unknown, local, accepted, sent, delayed, failed, delivered, bounced, complained]
        delivery_outcome_at: { type: [string, "null"], format: date-time }
        delivery_provider: { type: [string, "null"] }
        delivery_evidence:
          type: boolean
          description: Adapter supports delivery evidence; does not itself mean delivered
    InvitationResendInput:
      type: object
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
    InvitationSendReceipt:
      type: object
      required: [id, expires_at, delivery, provider]
      properties:
        id: { type: string, format: uuid }
        expires_at: { type: string, format: date-time }
        delivery:
          type: string
          enum: [local_only, smtp_accepted, resend_accepted, provider_accepted]
        provider: { type: string }
        messageId: { type: string }
        url:
          type: string
          description: Private local-only outbox link; never returned for live delivery
    ResendDeliveryInput:
      type: object
      required: [type]
      properties:
        type: { type: string }
