  /edge-console/events:
    get:
      tags: [edge-console]
      operationId: listEdgeEvents
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Scoped events, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /edge-console/commands:
    get:
      tags: [edge-console]
      operationId: listEdgeCommands
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Scoped command audit, content: { application/json: { schema: { type: array, items: { type: object } } } } }
  /me/buildings/{buildingId}/devices:
    get:
      tags: [edge-resident]
