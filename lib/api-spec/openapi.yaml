        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceCapabilityPolicyInput' }
      responses:
        '200': { description: Verified capability policy saved and audited }
