        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DefectTransitionInput" }
      responses:
        "200": { description: Defect after an authorized transition }
        "403": { description: User or active context is not authorized for this action }
        "409": { description: Stale version or invalid transition }
  /system/integrations:
