  /platform/organizations/{id}/state:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformOrganizationState
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformOrganizationState' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases:
    get:
      operationId: listPlatformCases
      parameters:
        - { name: queue, in: query, schema: { type: string, enum: [unassigned, mine, all], default: all } }
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved] } }
        - { name: priority, in: query, schema: { type: string, enum: [low, normal, high, urgent] } }
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
        - { name: overdue, in: query, schema: { type: string, enum: ['true', 'false'], default: 'false' } }
        - { name: search, in: query, schema: { type: string, maxLength: 100 } }
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
    post:
      operationId: createPlatformCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformCase
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}/attachments/{documentId}:
    parameters:
      - { $ref: '#/components/parameters/PlatformId' }
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: downloadPlatformCaseAttachment
      parameters:
        - { name: versionId, in: query, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Explicitly shared case document; private/no-store. Unassigned ordinary support cannot download.
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /platform/support-cases/{id}/messages:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: appendPlatformCaseMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseMessage' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/support-cases/{id}/change:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformCase
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformCaseChange' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding:
    get:
      operationId: listPlatformOnboarding
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
    post:
      operationId: createPlatformOnboardingStep
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformStepInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformOnboardingStep
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/onboarding/{id}/change:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: changePlatformOnboardingStep
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformStepChange' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports:
    get:
      operationId: listPlatformImports
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordsResponse' }
  /platform/imports/preview:
    post:
      operationId: previewPlatformImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformImportInput' }
      responses:
        '201': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports/{id}:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    get:
      operationId: getPlatformImport
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
  /platform/imports/{id}/confirm:
    parameters: [{ $ref: '#/components/parameters/PlatformId' }]
    post:
      operationId: confirmPlatformImport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlatformVersionIntent' }
      responses:
        '200': { $ref: '#/components/responses/PlatformRecordResponse' }
components:
  securitySchemes:
    ApiKeyBearer:
      type: http
      scheme: bearer
    EdgeBearer:
      type: http
      scheme: bearer
      description: Single-use bootstrap exchange produces a machine credential. Store only its hash in Vernatun Cloud.
    EdgeIdHeader:
      type: apiKey
      in: header
      name: X-Vernatun-Edge-Id
    EdgeTenantHeader:
      type: apiKey
      in: header
      name: X-Vernatun-Tenant-Id
    EdgeBuildingHeader:
      type: apiKey
      in: header
      name: X-Vernatun-Building-Id
    EdgeBlockHeader:
      type: apiKey
      in: header
      name: X-Vernatun-Block-Id
    SessionCookie:
      type: apiKey
      in: cookie
      name: connect.sid
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    PlatformId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    PlatformRecordResponse:
      description: Authorized platform record; sensitive nested records remain permission-filtered.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlatformRecord' }
    PlatformRecordsResponse:
      description: Authorized platform records.
      content:
        application/json:
          schema: { type: array, items: { $ref: '#/components/schemas/PlatformRecord' } }
  schemas:
    OperationIdResult:
      type: object
      required: [id]
      properties:
        id: {type: string}
        status: {type: string}
    EdgeBlockInput:
      type: object
      required: [code, name, buildingIds]
      properties:
        organizationId: { type: string, format: uuid }
        code: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 2, maxLength: 120 }
        buildingIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string, format: uuid } }
    EdgeBlockUpdate:
      type: object
      minProperties: 1
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        name: { type: string, minLength: 2, maxLength: 120 }
        buildingIds: { type: array, minItems: 1, maxItems: 1000, items: { type: string, format: uuid } }
    EdgeBlockBootstrapInput:
      type: object
      required: [edgeId, name, siteCode]
      properties:
        edgeId: { type: string, minLength: 3, maxLength: 80 }
        name: { type: string, minLength: 2, maxLength: 120 }
        siteCode: { type: string, minLength: 1, maxLength: 100 }
        expiresInMinutes: { type: integer, minimum: 5, maximum: 120, default: 30 }
    EdgeV2RegisterInput:
      type: object
      required: [protocolVersion, edgeId, tenantId, blockId, siteCode, edgeName]
      properties:
        protocolVersion: { type: integer, const: 2 }
        edgeId: { type: string, minLength: 3, maxLength: 80 }
        tenantId: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        siteCode: { type: string, minLength: 1, maxLength: 100 }
        edgeName: { type: string, minLength: 2, maxLength: 120 }
        agentVersion: { type: string, maxLength: 80 }
        platform: { type: string, maxLength: 60 }
        capabilities: { type: object, additionalProperties: true }
    EdgeV2RegisterResponse:
      type: object
      required: [protocolVersion, edgeId, tenantId, blockId, buildingIds, status, accessToken]
      properties:
        protocolVersion: { type: integer, const: 2 }
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        buildingIds: { type: array, items: { type: string, format: uuid } }
        status: { type: string, const: REGISTERED }
        accessToken: { type: string, description: One-time machine credential. Never log or display after bootstrap. }
        tokenType: { type: string, const: Bearer }
    EdgeV2HeartbeatInput:
      type: object
      required: [protocolVersion, edgeId, tenantId, blockId]
      properties:
        protocolVersion: { type: integer, const: 2 }
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        status: { type: string }
        agentVersion: { type: string, maxLength: 80 }
        local: { type: object, additionalProperties: true }
    EdgeV2InventoryInput:
      type: object
      required: [protocolVersion, edgeId, tenantId, blockId, devices]
      properties:
        protocolVersion: { type: integer, const: 2 }
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        devices:
          type: array
          maxItems: 5000
          items:
            type: object
            required: [buildingId, deviceId, profile]
            properties:
              buildingId: { type: string, format: uuid }
              deviceId: { type: string, maxLength: 200 }
              thingsboardId: { type: [string, 'null'], maxLength: 200 }
              name: { type: string, maxLength: 200 }
              profile: { type: string, maxLength: 100 }
              label: { type: [string, 'null'], maxLength: 200 }
              active: { type: [boolean, 'null'] }
    EdgeV2BatchInput:
      type: object
      required: [protocolVersion, edgeId, tenantId, blockId, items]
      properties:
        protocolVersion: { type: integer, const: 2 }
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        items:
          type: array
          maxItems: 2000
          items:
            type: object
            required: [buildingId, deviceId]
            properties:
              buildingId: { type: string, format: uuid }
              deviceId: { type: string, maxLength: 200 }
    EdgeV2CommandResult:
      type: object
      required: [protocolVersion, edgeId, tenantId, blockId, commandId, status]
      properties:
        protocolVersion: { type: integer, const: 2 }
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        commandId: { type: string, format: uuid }
        status: { type: string, enum: [SUCCESS, REJECTED, FAILED, DENIED] }
        result: { type: object, additionalProperties: true }
    EdgeRegisterInput:
      type: object
      required: [edgeId, edgeName, tenantId, buildingId, siteCode, agentVersion, platform, connectionMode, transports, capabilities]
      properties:
        edgeId: { type: string, minLength: 3, maxLength: 80 }
        edgeName: { type: string, minLength: 2, maxLength: 120 }
        tenantId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        siteCode: { type: string, minLength: 1, maxLength: 100 }
        agentVersion: { type: string, maxLength: 80 }
        platform: { type: string, maxLength: 60, example: Vernatun Edge }
        connectionMode: { type: string, enum: [OUTBOUND] }
        transports: { type: array, items: { type: string, enum: [WEBSOCKET, HTTPS] } }
        capabilities: { type: object, additionalProperties: { type: boolean } }
    EdgeRegisterResponse:
      type: object
      required: [status, edgeId, tenantId, buildingId, accessToken, oneTime]
      properties:
        status: { type: string, enum: [REGISTERED] }
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        accessToken: { type: string, description: Returned only to the registering Edge Agent. Never log or persist this value outside the Agent. }
        oneTime: { type: boolean, const: true }
    EdgeHeartbeatInput:
      type: object
      required: [edgeId, tenantId, buildingId, timestamp, local]
      properties:
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        local: { type: object, additionalProperties: true }
    EdgeInventoryInput:
      type: object
      required: [edgeId, tenantId, buildingId, timestamp, devices]
      properties:
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        devices: { type: array, items: { type: object, additionalProperties: true } }
    EdgeBatchInput:
      type: object
      required: [edgeId, tenantId, buildingId, timestamp, items]
      properties:
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        timestamp: { type: string, format: date-time }
        items: { type: array, maxItems: 2000, items: { type: object, additionalProperties: true } }
    EdgeAccepted:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    EdgeInventoryAccepted:
      allOf:
        - { $ref: '#/components/schemas/EdgeAccepted' }
        - type: object
          required: [devices]
          properties:
            devices: { type: integer, minimum: 0 }
    EdgeBatchAccepted:
      allOf:
        - { $ref: '#/components/schemas/EdgeAccepted' }
        - type: object
          required: [acceptedCount]
          properties:
            acceptedCount: { type: integer, minimum: 0 }
    EdgeConfiguration:
      type: object
      required: [edgeId, tenantId, buildingId, heartbeatIntervalSeconds, commandTimeoutSeconds]
      properties:
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        heartbeatIntervalSeconds: { type: integer, minimum: 1 }
        commandTimeoutSeconds: { type: integer, minimum: 1 }
        commandCapabilities: { type: array, items: { type: string } }
    EdgeCommandResult:
      type: object
      required: [edgeId, tenantId, buildingId, status]
      properties:
        edgeId: { type: string }
        tenantId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        status: { type: string, enum: [SUCCESS, REJECTED, FAILED, EXPIRED] }
        result: { type: object, additionalProperties: true }
    EdgeCommandResultResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean, const: true }
    EdgeBuilding:
      type: object
      required: [id, name, organization_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string, nullable: true }
        organization_id: { type: string, format: uuid }
        organization_name: { type: string, nullable: true }
    EdgeFleet:
      type: object
      required: [summary, nodes]
      properties:
        summary:
          type: object
          required: [total, online, degraded, offline, activeAlarms]
          properties:
            total: { type: integer, minimum: 0 }
            online: { type: integer, minimum: 0 }
            degraded: { type: integer, minimum: 0 }
            offline: { type: integer, minimum: 0 }
            activeAlarms: { type: integer, minimum: 0 }
            waiting: { type: integer, minimum: 0 }
            syncErrors: { type: integer, minimum: 0 }
            devices: { type: integer, minimum: 0 }
            lastSync: { type: [string, 'null'], format: date-time }
        nodes: { type: array, items: { $ref: '#/components/schemas/EdgeNode' } }
        pagination:
          type: object
          required: [page, pageSize, total, pages]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            total: { type: integer }
            pages: { type: integer }
        facets: { type: object, additionalProperties: true }
    EdgeNode:
      type: object
      required: [id, edge_id, organization_id, name, site_code, status, registration_state, queue_depth, device_count, active_alarms]
      properties:
        id: { type: string, format: uuid }
        edge_id: { type: string }
        organization_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        block_id: { type: string, format: uuid, nullable: true }
        protocol_version: { type: integer, enum: [1, 2] }
        name: { type: string }
        site_code: { type: string }
        project_name: { type: string }
        environment: { type: string, enum: [unknown, test, staging, production] }
        archived_at: { type: string, format: date-time, nullable: true }
        status: { type: string }
        registration_state: { type: string }
        agent_version: { type: string, nullable: true }
        local_authorization_status: { type: string }
        queue_depth: { type: integer, minimum: 0 }
        registered_at: { type: string, format: date-time, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_connected_at: { type: string, format: date-time, nullable: true }
        last_heartbeat_at: { type: [string, 'null'], format: date-time }
        last_inventory_at: { type: [string, 'null'], format: date-time }
        last_telemetry_at: { type: [string, 'null'], format: date-time }
        last_event_at: { type: [string, 'null'], format: date-time }
        last_alarm_at: { type: [string, 'null'], format: date-time }
        web_socket_open: { type: boolean }
        credential_active: { type: boolean }
        building_count: { type: integer }
        credential_version: { type: integer, nullable: true }
        organization_name: { type: string, nullable: true }
        building_name: { type: string, nullable: true }
        block_name: { type: string, nullable: true }
        device_count: { type: integer, minimum: 0 }
        active_alarms: { type: integer, minimum: 0 }
    EdgeDevice:
      type: object
      required: [id, edge_device_id, name]
      properties:
        id: { type: string, format: uuid }
        edge_device_id: { type: string }
        thingsboard_id: { type: string, nullable: true }
        name: { type: string }
        profile: { type: string, nullable: true }
        device_type: { type: string, nullable: true }
        label: { type: string, nullable: true }
        unit_id: { type: string, format: uuid, nullable: true }
        capabilities: { type: array, items: { type: string } }
        reported_online: { type: boolean, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        last_telemetry_at: { type: string, format: date-time, nullable: true }
    EdgeNodeDetail:
      type: object
      required: [node, buildings, devices, alarms]
      properties:
        node: { $ref: '#/components/schemas/EdgeNode' }
        buildings: { type: array, items: { type: object, required: [id, name], properties: { id: { type: string, format: uuid }, name: { type: string } } } }
        devices: { type: array, items: { $ref: '#/components/schemas/EdgeDevice' } }
        alarms: { type: array, items: { type: object, additionalProperties: true } }
        telemetry: { type: array, items: { type: object, additionalProperties: true } }
        events: { type: array, items: { type: object, additionalProperties: true } }
        commands: { type: array, items: { type: object, additionalProperties: true } }
        audit: { type: array, items: { type: object, additionalProperties: true } }
        tokens: { type: array, items: { type: object, additionalProperties: true } }
        configuration: { type: object, additionalProperties: true }
    EdgeDraftInput:
      type: object
      required: [edgeId, name, siteCode]
      additionalProperties: false
      properties:
        edgeId: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{2,79}$' }
        name: { type: string, minLength: 2, maxLength: 120 }
        siteCode: { type: string, minLength: 1, maxLength: 100 }
        organizationId: { type: string, format: uuid }
        buildingId: { type: string, format: uuid }
        blockId: { type: string, format: uuid }
        description: { type: string, maxLength: 2000 }
        projectName: { type: string, maxLength: 120 }
        environment: { type: string, enum: [unknown, test, staging, production] }
        heartbeatSeconds: { type: integer, minimum: 10, maximum: 300 }
        inventorySeconds: { type: integer, minimum: 30, maximum: 86400 }
        telemetrySeconds: { type: integer, minimum: 5, maximum: 3600 }
        enabledModules: { type: array, items: { type: string, enum: [access, fire_monitoring, elevator_monitoring, metering, hvac, pumps, cameras] } }
    EdgeTokenGenerationInput:
      type: object
      properties:
        expiresInMinutes: { type: integer, minimum: 5, maximum: 120, default: 30 }
    EdgeBoundBuilding:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string, nullable: true }
        is_primary: { type: boolean }
    EdgeDraftResult:
      type: object
      required: [id, edge_id, organization_id, protocol_version, name, site_code, registration_state, buildings]
      properties:
        id: { type: string, format: uuid }
        edge_id: { type: string }
        organization_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        block_id: { type: string, format: uuid, nullable: true }
        protocol_version: { type: integer, enum: [1, 2] }
        name: { type: string }
        site_code: { type: string }
        registration_state: { type: string }
        buildings: { type: array, items: { $ref: '#/components/schemas/EdgeBoundBuilding' } }
    EdgeDraftBootstrapResult:
      type: object
      required: [id, edge_id, organization_id, edge_name, site_code, expires_at, bootstrapToken, oneTime, buildings]
      properties:
        id: { type: string, format: uuid }
        edge_id: { type: string }
        edge_name: { type: string }
        organization_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        block_id: { type: string, format: uuid, nullable: true }
        protocol_version: { type: integer, enum: [1, 2] }
        site_code: { type: string }
        expires_at: { type: string, format: date-time }
        bootstrapToken: { type: string }
        oneTime: { type: boolean }
        buildings: { type: array, items: { $ref: '#/components/schemas/EdgeBoundBuilding' } }
    EdgeBuildingBindingInput:
      type: object
      required: [buildingIds]
      properties:
        buildingIds: { type: array, minItems: 1, maxItems: 1000, uniqueItems: true, items: { type: string, format: uuid } }
    EdgeNodeUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        siteCode: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 2000 }
        projectName: { type: string, maxLength: 120 }
        environment: { type: string, enum: [unknown, test, staging, production] }
        heartbeatSeconds: { type: integer, minimum: 10, maximum: 300 }
        inventorySeconds: { type: integer, minimum: 30, maximum: 86400 }
        telemetrySeconds: { type: integer, minimum: 5, maximum: 3600 }
        enabledModules: { type: array, items: { type: string, enum: [access, fire_monitoring, elevator_monitoring, metering, hvac, pumps, cameras] } }
    EdgeConnectionCheck:
      type: object
      required: [edgeId, webSocketOpen, heartbeatFresh, reachable, checkedAt, probe]
      properties:
        edgeId: { type: string }
        webSocketOpen: { type: boolean }
        heartbeatFresh: { type: boolean }
        heartbeatAgeSeconds: { type: integer, nullable: true }
        reachable: { type: boolean }
        checkedAt: { type: string, format: date-time }
        probe: { type: string, const: server_observed_state_no_device_commands }
        overallStatus: { type: string, enum: [OK, WARNING, FAILED, UNKNOWN] }
        checks: { type: object, additionalProperties: { type: object, additionalProperties: true } }
    EdgeBootstrapToken:
      type: object
      required: [id, edge_id, organization_id, protocol_version, expires_at, created_at, status]
      properties:
        id: { type: string, format: uuid }
        edge_id: { type: string }
        organization_id: { type: string, format: uuid }
        building_id: { type: string, format: uuid, nullable: true }
        block_id: { type: string, format: uuid, nullable: true }
        protocol_version: { type: integer, enum: [1, 2] }
        edge_name: { type: string }
        site_code: { type: string }
