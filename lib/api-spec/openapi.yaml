openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: edge
    description: Machine-to-machine integration for an outbound Vernatun Edge Agent.
  - name: edge-console
    description: Tenant- and role-scoped Edge fleet administration.
  - name: edge-resident
    description: Devices explicitly mapped to the current resident unit.
paths:
  /resident/payer-policy:
    $ref: './payer-responsibility.yaml#/paths/~1resident~1payer-policy'
  /resident/payer-policy/{serviceId}:
    $ref: './payer-responsibility.yaml#/paths/~1resident~1payer-policy~1{serviceId}'
  /resident/payer-responsibilities:
    $ref: './payer-responsibility.yaml#/paths/~1resident~1payer-responsibilities'
  /resident/payer-responsibilities/{id}:
    $ref: './payer-responsibility.yaml#/paths/~1resident~1payer-responsibilities~1{id}'
  /resident/household:
    $ref: './resident-continuity.yaml#/paths/~1resident~1household'
  /delegations/{id}/revoke:
    $ref: './resident-continuity.yaml#/paths/~1delegations~1{id}~1revoke'
  /resident/service-bookings/{id}/options:
    $ref: './resident-continuity.yaml#/paths/~1resident~1service-bookings~1{id}~1options'
  /resident/avatar:
    $ref: './resident-continuity.yaml#/paths/~1resident~1avatar'
  /resident/building-finance:
    $ref: './resident-continuity.yaml#/paths/~1resident~1building-finance'
  /resident/continuity:
    $ref: './resident-continuity.yaml#/paths/~1resident~1continuity'
  /resident/email-verification:
    $ref: './resident-continuity.yaml#/paths/~1resident~1email-verification'
  /resident/notification-settings:
    $ref: './resident-continuity.yaml#/paths/~1resident~1notification-settings'
  /resident/direct-chats:
    $ref: './resident-continuity.yaml#/paths/~1resident~1direct-chats'
  /resident/direct-chats/{id}/messages:
    $ref: './resident-continuity.yaml#/paths/~1resident~1direct-chats~1{id}~1messages'
  /resident/direct-chats/{id}/state:
    $ref: './resident-continuity.yaml#/paths/~1resident~1direct-chats~1{id}~1state'
  /resident/saved-searches:
    $ref: './resident-continuity.yaml#/paths/~1resident~1saved-searches'
  /resident/saved-searches/{id}:
    $ref: './resident-continuity.yaml#/paths/~1resident~1saved-searches~1{id}'
  /resident/property-comparison:
    $ref: './resident-continuity.yaml#/paths/~1resident~1property-comparison'
  /resident/platform-tickets:
    $ref: './resident-continuity.yaml#/paths/~1resident~1platform-tickets'
  /resident/ai-history:
    $ref: './resident-continuity.yaml#/paths/~1resident~1ai-history'
  /resident/ai-history/{id}:
    $ref: './resident-continuity.yaml#/paths/~1resident~1ai-history~1{id}'
  /resident/service-bookings:
    $ref: './resident-continuity.yaml#/paths/~1resident~1service-bookings'
  /resident/service-bookings/{id}:
    $ref: './resident-continuity.yaml#/paths/~1resident~1service-bookings~1{id}'
  /meters:
    $ref: './resident.yaml#/paths/~1meters'
  /meters/{id}/readings:
    $ref: './resident.yaml#/paths/~1meters~1{id}~1readings'
  /announcements:
    $ref: './resident.yaml#/paths/~1announcements'
  /documents:
    $ref: './resident.yaml#/paths/~1documents'
  /documents/{id}/download:
    $ref: './resident.yaml#/paths/~1documents~1{id}~1download'
  /passes:
    $ref: './resident.yaml#/paths/~1passes'
  /passes/{id}/revoke:
    $ref: './resident.yaml#/paths/~1passes~1{id}~1revoke'
  /notifications:
    $ref: './resident.yaml#/paths/~1notifications'
  /notifications/{id}/read:
    $ref: './resident.yaml#/paths/~1notifications~1{id}~1read'
  /invoices:
    $ref: './resident.yaml#/paths/~1invoices'
  /me/contexts:
    $ref: './resident.yaml#/paths/~1me~1contexts'
  /resident/workspace:
    $ref: './resident.yaml#/paths/~1resident~1workspace'
  /resident/profile:
    $ref: './resident.yaml#/paths/~1resident~1profile'
  /resident/records/{kind}:
    $ref: './resident.yaml#/paths/~1resident~1records~1{kind}'
  /resident/listings/{id}/photos:
    $ref: './resident.yaml#/paths/~1resident~1listings~1{id}~1photos'
  /resident/listings/{id}/photos/{photoId}:
    $ref: './resident.yaml#/paths/~1resident~1listings~1{id}~1photos~1{photoId}'
  /resident/records/{kind}/{id}:
    $ref: './resident.yaml#/paths/~1resident~1records~1{kind}~1{id}'
  /resident/records/{kind}/{id}/actions:
    $ref: './resident.yaml#/paths/~1resident~1records~1{kind}~1{id}~1actions'
  /resident/records/{kind}/{id}/messages:
    $ref: './resident.yaml#/paths/~1resident~1records~1{kind}~1{id}~1messages'
  /resident/admin/buildings:
    $ref: './resident.yaml#/paths/~1resident~1admin~1buildings'
  /resident/settings:
    $ref: './resident.yaml#/paths/~1resident~1settings'
  /edge/v1/register:
    post:
      tags: [edge]
      operationId: registerEdgeV1
      summary: Register one Edge Agent using a single-use building-bound bootstrap token
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBuildingHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeRegisterInput' }
      responses:
        '201':
          description: Registered. accessToken is returned once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EdgeRegisterResponse' }
        '401': { description: "Bootstrap token is invalid, expired, revoked, or already used" }
        '403': { description: Header or token tenant/building binding mismatch }
        '409': { description: Edge node or building already has a registration }
  /edge/v1/heartbeat:
    post:
      tags: [edge]
      operationId: reportEdgeHeartbeat
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBuildingHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeHeartbeatInput' }
      responses:
        '200': { description: Heartbeat accepted, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeAccepted' } } } }
        '401': { description: Machine credential rejected }
        '403': { description: Tenant/building identity mismatch }
  /edge/v1/inventory:
    post:
      tags: [edge]
      operationId: syncEdgeInventory
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBuildingHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeInventoryInput' }
      responses:
        '200': { description: Inventory synchronized, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeInventoryAccepted' } } } }
        '401': { description: Machine credential rejected }
        '403': { description: Tenant/building identity mismatch }
  /edge/v1/telemetry/batch:
    post:
      tags: [edge]
      operationId: ingestEdgeTelemetryBatch
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBuildingHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeBatchInput' }
      responses:
        '200': { description: Latest telemetry values accepted, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeBatchAccepted' } } } }
        '401': { description: Machine credential rejected }
  /edge/v1/events/batch:
    post:
      tags: [edge]
      operationId: ingestEdgeEventsBatch
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBuildingHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeBatchInput' }
      responses:
        '200': { description: Idempotent event batch accepted, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeBatchAccepted' } } } }
        '401': { description: Machine credential rejected }
  /edge/v1/alarms/batch:
    post:
      tags: [edge]
      operationId: ingestEdgeAlarmsBatch
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBuildingHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeBatchInput' }
      responses:
        '200': { description: Idempotent alarms batch accepted, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeBatchAccepted' } } } }
        '401': { description: Machine credential rejected }
  /edge/v1/config:
    get:
      tags: [edge]
      operationId: getEdgeConfiguration
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBuildingHeader: []
      parameters:
        - { name: edgeId, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
      responses:
        '200': { description: "Tenant-bound, non-secret agent configuration", content: { application/json: { schema: { $ref: '#/components/schemas/EdgeConfiguration' } } } }
        '401': { description: Machine credential rejected }
  /edge/v1/commands/{commandId}/result:
    post:
      tags: [edge]
      operationId: reportEdgeCommandResult
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBuildingHeader: []
      parameters:
        - { name: commandId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeCommandResult' }
      responses:
        '200': { description: Command result recorded, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeCommandResultResponse' } } } }
        '401': { description: Machine credential rejected }
        '409': { description: Conflicting result or invalid command state }
  /edge/v2/register:
    post:
      tags: [edge]
      operationId: registerEdgeV2
      summary: Register a block-scoped Edge Agent
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBlockHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeV2RegisterInput' }
      responses:
        '201': { description: Registered with one-time token and authorized building IDs }
        '401': { description: "Bootstrap token invalid, expired, revoked, or used" }
        '403': { description: Block or identity scope mismatch }
  /edge/v2/heartbeat:
    post:
      tags: [edge]
      operationId: reportEdgeHeartbeatV2
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBlockHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeV2HeartbeatInput' }
      responses:
        '200': { description: Heartbeat accepted }
        '403': { description: Tenant or block scope mismatch }
  /edge/v2/inventory:
    post:
      tags: [edge]
      operationId: syncEdgeInventoryV2
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBlockHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeV2InventoryInput' }
      responses:
        '200': { description: Inventory synchronized for explicitly assigned buildings }
        '403': { description: Device building is outside this block }
  /edge/v2/telemetry/batch:
    post:
      tags: [edge]
      operationId: ingestEdgeTelemetryBatchV2
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBlockHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeV2BatchInput' }
      responses:
        '200': { description: Telemetry batch accepted }
  /edge/v2/events/batch:
    post:
      tags: [edge]
      operationId: ingestEdgeEventsBatchV2
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBlockHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeV2BatchInput' }
      responses:
        '200': { description: Idempotent events accepted }
  /edge/v2/alarms/batch:
    post:
      tags: [edge]
      operationId: ingestEdgeAlarmsBatchV2
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBlockHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeV2BatchInput' }
      responses:
        '200': { description: Idempotent alarms accepted }
  /edge/v2/config:
    get:
      tags: [edge]
      operationId: getEdgeConfigurationV2
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBlockHeader: []
      parameters:
        - { name: edgeId, in: query, required: true, schema: { type: string, minLength: 3, maxLength: 80 } }
      responses:
        '200': { description: Non-secret configuration and authorized building IDs }
  /edge/v2/commands/{commandId}/result:
    post:
      tags: [edge]
      operationId: reportEdgeCommandResultV2
      security:
        - EdgeBearer: []
          EdgeIdHeader: []
          EdgeTenantHeader: []
          EdgeBlockHeader: []
      parameters:
        - { name: commandId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeV2CommandResult' }
      responses:
        '200': { description: Command result recorded }
        '409': { description: Conflicting result or command state }
  /edge-console/blocks:
    get:
      tags: [edge-console]
      operationId: listEdgeBlocks
      security: [{ SessionCookie: [] }]
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200': { description: Scoped Edge blocks and assigned buildings; archived blocks are excluded by default }
    post:
      tags: [edge-console]
      operationId: createEdgeBlock
      security: [{ SessionCookie: [], CsrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeBlockInput' }
      responses:
        '201': { description: Block created with explicit building membership }
        '409': { description: Building already assigned to a block }
  /edge-console/blocks/{id}:
    patch:
      tags: [edge-console]
      operationId: updateEdgeBlock
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeBlockUpdate' }
      responses:
        '200': { description: Block metadata and explicitly assigned buildings updated }
        '403': { description: Block is outside caller scope or recent authentication required }
        '409': { description: Building assignment is locked after Edge node registration }
    delete:
      tags: [edge-console]
      operationId: archiveEdgeBlock
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: Block archived; historical assignments and audit records are preserved }
        '409': { description: Archive active Edge nodes first }
  /edge-console/blocks/{id}/restore:
    post:
      tags: [edge-console]
      operationId: restoreEdgeBlockById
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: Archived block restored }
        '404': { description: Archived block not found }
  /edge-console/blocks/{id}/bootstrap-tokens:
    post:
      tags: [edge-console]
      operationId: createBlockEdgeBootstrapToken
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeBlockBootstrapInput' }
      responses:
        '201': { description: "Single-use v2 token shown once" }
        '403': { description: Block is outside caller scope }
  /edge-console/buildings:
    get:
      tags: [edge-console]
      operationId: listEdgeBuildings
      security: [{ SessionCookie: [] }]
      responses:
        '200': { description: Buildings available for Edge onboarding, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EdgeBuilding' } } } } }
        '403': { description: Edge provisioning permission required }
  /edge-console/fleet:
    get:
      tags: [edge-console]
      operationId: getEdgeFleet
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: search, in: query, schema: { type: string, maxLength: 200 } }
        - { name: organizationId, in: query, schema: { type: string, format: uuid } }
        - { name: blockId, in: query, schema: { type: string, format: uuid } }
        - { name: buildingId, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { type: string, enum: [ONLINE, OFFLINE, DEGRADED, UNKNOWN, DISABLED] } }
        - { name: websocket, in: query, schema: { type: string, enum: [CONNECTED, DISCONNECTED] } }
        - { name: version, in: query, schema: { type: string } }
        - { name: project, in: query, schema: { type: string } }
        - { name: environment, in: query, schema: { type: string, enum: [unknown, test, staging, production] } }
        - { name: registration, in: query, schema: { type: string, enum: [PENDING_REGISTRATION, REGISTERED, REVOKED] } }
        - name: includeArchived
          in: query
          required: false
          schema: { type: boolean, default: false }
      responses:
        '200': { description: Role- and tenant-scoped Edge fleet summary, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeFleet' } } } }
        '403': { description: Edge fleet permission or organization context required }
  /edge-console/nodes:
    post:
      tags: [edge-console]
      operationId: createEdgeDraft
      security: [{ SessionCookie: [], CsrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeDraftInput' }
      responses:
        '201': { description: Pending node with v1 building or v2 block bindings, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeDraftResult' } } } }
        '403': { description: Permission or organization scope rejected }
        '409': { description: Duplicate identity or immutable scope conflict }
  /edge-console/nodes/{id}/bootstrap-token:
    post:
      tags: [edge-console]
      operationId: generateEdgeDraftToken
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeTokenGenerationInput' }
      responses:
        '201': { description: One-time token with exact snake_case registration bindings; replaces any unconsumed token, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeDraftBootstrapResult' } } } }
        '403': { description: Bootstrap permission or recent authentication required }
        '409': { description: Already registered or archived }
  /edge-console/nodes/{id}/buildings:
    get:
      tags: [edge-console]
      operationId: listEdgeBoundBuildings
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: Authorized node building bindings }
    patch:
      tags: [edge-console]
      operationId: updateEdgeBoundBuildings
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeBuildingBindingInput' }
      responses:
        '200': { description: Versioned v2 explicit block-scoped bindings saved and audited }
        '409': { description: v1 immutable binding or building with retained device/history references }
  /edge-console/bootstrap-tokens:
    get:
      tags: [edge-console]
      operationId: listEdgeBootstrapTokens
      security: [{ SessionCookie: [] }]
      responses:
        '200':
          description: Scoped token metadata only; plaintext and token hashes are never returned.
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items: { $ref: '#/components/schemas/EdgeBootstrapToken' }
        '403': { description: Edge provisioning permission required }
    post:
      tags: [edge-console]
      operationId: createEdgeBootstrapToken
      security: [{ SessionCookie: [], CsrfToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeBootstrapInput' }
      responses:
        '201': { description: "Short-lived single-use token, shown once", content: { application/json: { schema: { $ref: '#/components/schemas/EdgeBootstrapResponse' } } } }
        '403': { description: "Provisioning permission, module entitlement, or recent authentication required" }
        '409': { description: Edge registration or unexpired bootstrap token already exists }
  /edge-console/bootstrap-tokens/{id}/revoke:
    post:
      tags: [edge-console]
      operationId: revokeEdgeBootstrapToken
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: Unused bootstrap token revoked }
        '404': { description: Token not found or already consumed }
  /edge-console/nodes/{id}:
    get:
      tags: [edge-console]
      operationId: getEdgeNode
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: "Scoped node, devices, and recent alarms", content: { application/json: { schema: { $ref: '#/components/schemas/EdgeNodeDetail' } } } }
        '404': { description: Node is outside the current scope }
    patch:
      tags: [edge-console]
      operationId: updateEdgeNodeMetadata
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeNodeUpdate' }
      responses:
        '200': { description: Human-readable node name or site code updated; identity and scope remain immutable }
        '403': { description: Edge management permission or recent authentication required }
        '409': { description: Archived node cannot be edited }
    delete:
      tags: [edge-console]
      operationId: archiveEdgeNode
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: "Node credentials revoked, active socket closed, and history preserved" }
        '403': { description: Edge management permission or recent authentication required }
  /edge-console/nodes/{id}/restore:
    post:
      tags: [edge-console]
      operationId: restoreEdgeNode
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: Node restored; a new credential must be staged before the agent reconnects }
        '404': { description: Archived node not found }
  /edge-console/nodes/{id}/connection-check:
    get:
      tags: [edge-console]
      operationId: checkEdgeNodeConnection
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: Read-only check of live WebSocket state and recent heartbeat, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeConnectionCheck' } } } }
        '403': { description: Edge read permission required }
  /edge-console/nodes/{id}/devices:
    get:
      tags: [edge-console]
      operationId: listEdgeNodeDevices
      security: [{ SessionCookie: [] }]
      parameters:
        - { $ref: '#/components/parameters/PlatformId' }
      responses:
        '200': { description: Scoped device inventory, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EdgeDevice' } } } } }
  /edge-console/nodes/{id}/credentials/rotate:
