openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /system/overview:
    get:
      operationId: getSystemOverview
      responses:
        "200":
          description: Safe runtime observations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemOverview"}
  /system/health:
    get:
      operationId: getSystemHealth
      responses:
        "200":
          description: Safe runtime checks
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemOverview"}
  /system/logs:
    get:
      operationId: getSystemLogs
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: from, in: query, schema: {type: string}}
        - {name: to, in: query, schema: {type: string}}
        - {name: level, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: user, in: query, schema: {type: string}}
        - {name: organization, in: query, schema: {type: string}}
        - {name: requestId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: integer}}
        - {name: endpoint, in: query, schema: {type: string}}
        - {name: errorCode, in: query, schema: {type: string}}
        - {name: job, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        "200":
          description: Paginated operational metadata, separate from business audit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemLogs"}
  /system/jobs:
    get:
      operationId: getSystemJobs
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Observed scheduled executions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemJobs"}
  /handover-readiness:
    get:
      operationId: getHandoverReadiness
      responses:
        '200':
          description: Scoped units, floor registry and evidence-based readiness
          content: {application/json: {schema: {$ref: '#/components/schemas/HandoverReadiness'}}}
  /handover-floors:
    post:
      operationId: createHandoverFloor
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HandoverFloorInput'}}}
      responses:
        '201':
          description: Existing or newly created floor
          content: {application/json: {schema: {$ref: '#/components/schemas/HandoverFloorReceipt'}}}
  /handover-readiness/{unitId}/floor:
    post:
      operationId: assignHandoverFloor
      parameters:
        - {in: path, name: unitId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HandoverFloorAssignment'}}}
      responses:
        '200':
          description: Saved mapping revision
          content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanReceipt'}}}
  /unit-plans/{unitId}:
    parameters:
      - {in: path, name: unitId, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getUnitPlan
      responses:
        '200':
          description: Current private plan and defects within handover scope
          content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanView'}}}
    post:
      operationId: changeUnitPlan
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanChange'}}}
      responses:
        '200':
          description: Updated revision
          content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanReceipt'}}}
  /unit-plans/{unitId}/image:
    post:
      operationId: uploadUnitPlan
      parameters:
        - {in: path, name: unitId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: key, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: revision, required: true, schema: {type: integer, minimum: 0}}
        - {in: query, name: planId, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '201':
          description: Sanitized image saved; previous plan retired, never deleted
          content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanReceipt'}}}
  /unit-plans/{unitId}/{planId}/image:
    get:
      operationId: getUnitPlanImage
      parameters:
        - {in: path, name: unitId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: planId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Authorized current plan image
          content: {image/jpeg: {schema: {type: string, format: binary}}}
  /operations/availability/options:
    get:
      operationId: getAvailabilityOptions
      responses:
        '200':
          description: Units within the reader scope; technicians only get units from their work orders
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AvailabilityUnit'}
  /operations/availability:
    get:
      operationId: getStaffAvailability
      parameters:
        - {in: query, name: unitId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Scoped interval availability; absence of shifts is unknown, never free
          content: {application/json: {schema: {$ref: '#/components/schemas/StaffAvailability'}}}
    post:
      operationId: createAvailabilityBlock
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBlockInput'}}}
      responses:
        '201':
          description: Saved block, or the existing receipt on retry
          content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBlock'}}}
  /operations/availability/{id}/change:
    post:
      operationId: changeAvailabilityBlock
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBlockChange'}}}
      responses:
        '200':
          description: Versioned change or cancellation, no hard deletion
          content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBlock'}}}
  /defects/{id}/collaboration:
    get:
      operationId: getDefectCollaboration
      description: Assigned-contractor or scoped defect-reader access only. Evidence is not access to the general document catalog.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: before, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Append-only conversation and existing defect evidence
          content: { application/json: { schema: { $ref: '#/components/schemas/DefectCollaboration' } } }
        '403': { description: Missing permission or module }
        '404': { description: Defect or cursor outside scope }
  /defects/{id}/messages:
    post:
      operationId: postDefectMessage
      description: Append a clarification without transitioning the defect. Requires CSRF and defects.execute (assigned contractor) or defects.manage; read-only subscriptions cannot write.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DefectMessageInput' } } }
      responses:
        '201':
          description: Persisted message, or the same receipt on idempotent retry
          content: { application/json: { schema: { $ref: '#/components/schemas/DefectMessage' } } }
        '400': { description: Invalid text or operation key }
        '403': { description: Write access denied }
        '404': { description: Defect outside scope }
        '409': { description: Operation key reused with different content }
  /role-insights:
    get:
      operationId: getRoleInsights
      description: Live permission/module-scoped role totals. Optional period filters financial cards only; other cards describe current operational state.
      parameters:
        - { in: query, name: currency, schema: { type: string, enum: [AMD, RUB, USD] } }
        - { in: query, name: period, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Scoped metrics; no inferred trends or external payment revenue
          content:
            application/json:
              schema:
                type: object
                required: [cards]
                properties:
                  cards:
                    type: array
                    items: { $ref: '#/components/schemas/RoleInsightCard' }
        '401': { description: Authentication required }
        '403': { description: Inactive or unavailable role context }
  /roles/{id}/options:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAssignmentScopeOptions
      description: IAM-only building and unit identifiers and labels. Does not grant tenant business-data access.
      responses:
        '200': { description: Scope selectors, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '404': { description: Assignment outside authorized scope }
  /iam/catalog:
    get:
      operationId: getIamCatalog
      responses:
        '200': { description: "Immutable role catalog, existing permissions, exceptional grant allowlist", content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
  /iam/users:
    get:
      operationId: listIamUsers
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000 } }
      responses:
        '200': { description: "Scoped rows, total, offset and limit; no credentials", content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
  /iam/users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getIamUser
      responses:
        '200': { description: "Scoped user, assignments and history; hashed session handles for platform admins only", content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '404': { description: Not found or outside scope }
  /iam/users/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: changeIamAccountStatus
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamAccountStatusInput' } } }
      responses:
        '204': { description: Account status changed; disable/lock also revoke sessions }
        '403': { description: Platform administrator required; self changes forbidden }
        '409': { description: Last administrator would be lost }
  /iam/users/{id}/logout:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeIamSessions
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamSessionRevocationInput' } } }
      responses:
        '204': { description: Sessions revoked }
        '403': { description: Platform administrator required; self changes forbidden }
  /iam/profiles:
    get:
      operationId: listIamProfiles
      responses:
        '200': { description: Organization profiles and tenant-allowed global templates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IamRecord' } } } } }
    post:
      operationId: createIamProfile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamProfileInput' } } }
      responses:
        '201': { description: Created profile with concurrency token, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '403': { description: Undelegable permission or unauthorized scope }
  /iam/profiles/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateIamProfile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamProfileInput' } } }
      responses:
        '200': { description: Updated profile; base role immutable, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '409': { description: Concurrent change or administrator protection }
  /iam/assignments/{id}/access:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: explainIamAccess
      description: Shared permission/module/subscription evaluator. Not an unconditional resource authorization; workflow, ownership and session MFA still apply.
      responses:
        '200': { description: "Effective permission decisions, reasons, scope, profile and rules", content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '404': { description: Assignment outside authorized scope }
    post:
      operationId: simulateIamAccess
      description: Read-only permission explanation for a requested HTTP method; does not perform the operation.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamAccessInput' } } }
      responses:
        '200': { description: Permission explanation, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '404': { description: Assignment outside authorized scope }
  /iam/assignments/{id}/policy:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: updateIamAssignmentPolicy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamAssignmentPolicyInput' } } }
      responses:
        '200': { description: Policy saved and audited, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '403': { description: "Self, protected role, cross-scope or unsupported grant" }
        '409': { description: Concurrent change or inactive assignment }
  /iam/assignments/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: changeIamAssignmentStatus
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamAssignmentStatusInput' } } }
      responses:
        '204': { description: Assignment status changed }
        '403': { description: Protected or self assignment }
        '409': { description: Revoked assignment or concurrent change }
  /roles/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEmployeeAssignment
      description: Requires roles.assign in the active organization context. Base permissions are not effective-access decisions.
      responses:
        '200':
          description: Assignment card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeAssignmentDetail' }
        '403': { description: Permission denied }
        '404': { description: Assignment outside active scope or not found }
    patch:
      operationId: updateEmployeeAssignment
      description: Changes an active staff assignment, never self or residential lifecycle assignments. Optimistic concurrency token is mandatory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeAssignmentUpdate' }
      responses:
        '200':
          description: Updated assignment
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment: { $ref: '#/components/schemas/EmployeeAssignment' }
        '400': { description: Invalid dates or scope }
        '403': { description: Permission denied or immutable assignment }
        '404': { description: Assignment or property outside active scope }
        '409': { description: concurrent_change or last_administrator }
    delete:
      operationId: revokeEmployeeAssignment
      description: Revokes a non-self assignment with scope and last-administrator protection; never deletes the user.
      responses:
        '204': { description: Revoked or already inactive }
        '403': { description: Permission denied }
        '404': { description: Assignment outside active scope }
        '409': { description: last_administrator }
  /leads:
    post:
      operationId: submitLandingLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandingLeadInput' }
      responses:
        "201":
          description: Stored in the first-party database, not email delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingLeadReceipt' }
        "400": { description: Validation or honeypot rejection }
        "403": { description: CSRF or origin rejected }
        "429": { description: Rate limited }
    get:
      operationId: getLandingLeads
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, name] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: language, in: query, schema: { type: string, enum: [hy, ru, en] } }
      responses:
        "200":
          description: Separate leads.read permission in platform context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingLeadPage' }
        "403": { description: Forbidden }
  /mfa/policy:
    get:
      operationId: getMfaPolicy
      responses:
        "200":
          description: Current context policy, enrollment, recent proof and management capability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaPolicyState' }
    put:
      operationId: updateMfaPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaPolicyInput' }
      responses:
        "200":
          description: CAS update; required activation at least 24 hours ahead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaPolicy' }
        "400": { description: Invalid rollout date or input }
        "403": { description: "Privilege, subscription or recent MFA proof required" }
        "409": { description: Version conflict }
  /paged/{resource}:
    get:
      operationId: getScopedRecordPage
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [organizations, properties, units, people, invitations, audit] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: sort, in: query, schema: { type: string, maxLength: 40 }, description: Per-resource allowlisted column only. }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: filter, in: query, schema: { type: string, enum: [all, "true", "false"] } }
      responses:
        "200":
          description: Fresh authorized scope; SQL paging and stable tie-breaker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopedRecordPage' }
        "400": { description: Invalid query or unsupported sort }
        "403": { description: Forbidden }
  /organizations/{id}/branding/logo:
    get:
      operationId: getPrivateBrandLogo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current sanitized logo, active organization context, private no-store.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { description: Not accessible or not the current logo }
  /notifications/catalog:
    get:
      operationId: getNotificationCatalog
      responses:
        "200":
          description: Event catalog, categories, channel readiness and explicit critical policy.
          content:
            application/json:
              schema:
                type: object
                required: [events, categories, channels]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [code, category, critical]
                      properties:
                        code: {type: string}
                        category: {type: string}
                        critical: {type: boolean}
                  categories: {type: array, items: {type: string}}
                  channels:
                    type: object
                    properties:
                      in_app: {type: string, enum: [active]}
                      email: {type: string, enum: [pending_domain]}
                      sms: {type: string, enum: [future]}
                      push: {type: string, enum: [future]}
  /notifications/preferences:
    get:
      operationId: getNotificationPreferences
      responses:
        "200":
          description: Global user preferences; a missing row has version zero.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPreferences"}
    put:
      operationId: updateNotificationPreferences
      description: Future notifications only. CAS conflict returns 409; only catalog-critical account security overrides opt-out.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationPreferences"}
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPreferences"}
  /notifications/due:
    post:
      operationId: examineDueNotifications
      description: Organization-settings permission, idempotent due reminder generation, no email sends.
      responses:
        "200":
          description: Examination summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  examinedDueRecords: {type: integer}
                  email: {type: string, enum: [pending_domain]}
  /organization/branding:
    get:
      operationId: getOrganizationBranding
      responses:
        "200":
          description: Current context organization branding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationBrandingState"}
    put:
      operationId: updateOrganizationBranding
      description: Organization settings permission, CAS version, strict hex colors and HTTPS URLs; no HTML or logo URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, branding]
              properties:
                version: {type: integer, minimum: 0}
                branding: {$ref: "#/components/schemas/OrganizationBrandingMetadata"}
      responses:
        "200":
          description: Saved branding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationBrandingState"}
  /organization/branding/logo:
    parameters:
      - name: version
        in: query
        required: true
        schema: {type: integer, minimum: 0}
    post:
      operationId: uploadOrganizationLogo
      description: 2 MB PNG/JPEG/WebP only, sanitized private JPEG; SVG/HTML rejected, stale version returns 409.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Saved logo reference
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationBrandingState"}
    delete:
      operationId: removeOrganizationLogo
      description: Clear reference only; never deletes private bytes.
      responses:
        "200":
          description: Updated branding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationBrandingState"}
  /portfolio/objects:
    get:
      operationId: listPortfolioObjects
      description: Current organization and building scope; properties.read, no finance module required.
      responses:
        "200":
          description: Real portfolio groups and assigned buildings
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/PortfolioObject"}}
    post:
      operationId: createPortfolioObject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PortfolioObjectInput"}
      responses:
        "201":
          description: Created empty object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortfolioObject"}
  /portfolio/objects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updatePortfolioObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/PortfolioObjectInput"}
                - type: object
                  required: [version]
                  properties:
                    version: {type: integer, minimum: 1}
      responses:
        "200":
          description: Updated object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortfolioObject"}
    delete:
      operationId: deleteEmptyPortfolioObject
      description: Explicit CAS deletion of an empty group only. Buildings, units and history are never deleted.
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Empty object deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
