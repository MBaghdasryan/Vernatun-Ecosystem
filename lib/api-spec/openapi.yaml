      operationId: getIntegrationCenter
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Provider catalog and safe instance metadata
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationCenter'}
    post:
      operationId: createIntegrationInstance
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationCreateInput'}
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationIdResult'}
  /system/integrations/{id}:
    put:
      operationId: updateIntegrationInstance
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationUpdateInput'}
      responses:
        '200':
          description: Saved and disabled until tested
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationIdResult'}
  /system/integrations/{id}/{action}:
    post:
      operationId: actIntegrationInstance
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - in: path
          name: action
          required: true
          schema: {type: string, enum: [test, activate, deactivate, delete]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationInstanceActionInput'}
      responses:
        '200':
          description: Action result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationIdResult'}
  /system/webhooks:
    get:
      operationId: getWebhookCenter
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Webhook configuration and paged delivery metadata, never secrets
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WebhookCenter'}
    post:
      operationId: createOutgoingWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookCreateInput'}
      responses:
        '201':
          description: Secret once; initially disabled
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyActionResult'}
  /system/webhooks/{id}/state:
    post:
      operationId: setOutgoingWebhookState
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OutgoingWebhookStateInput'}
      responses:
        '200':
          description: State changed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationIdResult'}
  /system/webhooks/deliveries/{id}/{action}:
    post:
      operationId: actWebhookDelivery
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - in: path
          name: action
          required: true
          schema: {type: string, enum: [retry, cancel]}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/WebhookDeliveryActionInput'}
      responses:
        '200':
          description: Queued retry or cancelled queued delivery
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationIdResult'}
  /system/api/docs:
    get:
      operationId: getSystemApiDocumentation
      responses:
        '200':
          description: Protected read-only OpenAPI document, no arbitrary try-it-out execution
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /system/modules:
    get:
      operationId: getSystemModuleRegistry
      responses:
        '200':
          description: Source-registered core modules, entitlement counts, and the disabled extension-package policy
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /modules:
    get:
      operationId: getOrganizationModules
      responses:
        '200':
          description: Modules available to the current organization under its active subscription policy
          content:
            application/json:
              schema:
                type: object
                required: [modules, enforced, state, readOnly]
                properties:
                  modules:
                    type: array
                    items:
                      type: object
                      required: [module, enabled, override_state, updatedAt]
                      properties:
                        module: {type: string, enum: [requests, finance, handover, access, community, maintenance, meters, documents]}
                        enabled: {type: boolean}
                        override_state: {type: string, enum: [inherited, enabled, disabled]}
                        updatedAt: {type: string}
                  enforced: {type: boolean}
                  state: {type: string}
                  readOnly: {type: boolean}
  /modules/{module}:
    parameters:
      - name: module
        in: path
        required: true
        schema:
          type: string
          enum: [requests, finance, handover, access, community, maintenance, meters, documents]
    patch:
      operationId: updateOrganizationModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled, expectedUpdatedAt]
              properties:
                enabled: {type: boolean}
                expectedUpdatedAt: {type: string, minLength: 1, maxLength: 64}
      responses:
        '200':
          description: Updated module entitlement and concurrency token
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '403':
          description: Module is outside the plan, subscription is read-only, or permission is missing
        '409':
          description: Module changed since it was read
  /system/updates:
    get:
      operationId: getSystemUpdates
      responses:
        '200':
          description: Update package history and deployment-provider capability
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /system/updates/upload:
    post:
      operationId: uploadSystemUpdate
      parameters:
        - in: header
          name: X-Update-Filename
          required: true
          schema: {type: string, maxLength: 84}
        - in: header
          name: X-Confirmation
          required: true
          schema: {type: string, enum: ["UPDATE PACKAGE"]}
      requestBody:
        required: true
        content:
          application/zip:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Uploaded package with validation result; never executed
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /system/updates/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getSystemUpdate
      responses:
        '200':
          description: Safe update metadata without package bytes
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /system/updates/{id}/validate:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: validateSystemUpdate
      responses:
        '200':
          description: Revalidated stored package manifest, checksum, compatibility, and archive contents
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /system/updates/{id}/stage:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: stageSystemUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [backupId, confirmation]
              properties:
                backupId: {type: string, format: uuid}
                confirmation: {type: string, enum: ["STAGE UPDATE"]}
      responses:
        '200':
          description: Compatible update staged with a verified backup and the current migration baseline
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
  /system/updates/{id}/install:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: installSystemUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: ["INSTALL UPDATE"]}
      responses:
        '202':
          description: Immutable update artifact accepted by the configured release pipeline
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '409':
          description: Staging, backup, migration, or deployment preflight is not satisfied
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '503': {description: Release pipeline is not configured}
  /system/updates/{id}/rollback:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: rollbackSystemUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: ["ROLLBACK UPDATE"]}
      responses:
        '202':
          description: Previous immutable release accepted by the configured rollback pipeline
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '409':
          description: Previous immutable release, verified backup, or migration baseline is not available
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '503': {description: Release pipeline is not configured}
  /system/updates/{id}/pipeline-result:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: reportSystemUpdatePipelineResult
      security:
        - ApiKeyBearer: []
      description: Internal deployment-pipeline callback authenticated with a one-release bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReleasePipelineCallbackInput'}
      responses:
        '200': {description: Pipeline result accepted or safely deduplicated}
        '401': {description: Invalid or expired release callback token}
        '409': {description: Callback does not match the active release action or required evidence}
  /system/api:
    get:
      operationId: getApiCenter
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: API clients and key metadata without hashes or secrets
          content:
            application/json:
              schema:
                type: object
                required: [scopes, clients, keys, page, total]
                properties:
                  scopes: {type: array, items: {type: string}}
                  clients: {type: array, items: {$ref: '#/components/schemas/ManagedApiClient'}}
                  keys: {type: array, items: {$ref: '#/components/schemas/ManagedApiKey'}}
                  page: {type: integer}
                  total: {type: integer}
  /system/api/clients:
    post:
      operationId: createApiClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, organizationId, clientType, allowedScopes, confirmation]
              properties:
                name: {type: string}
                description: {type: string}
                organizationId: {type: [string, "null"]}
                clientType: {type: string, enum: [platform, organization, integration, machine_to_machine]}
                allowedScopes: {type: array, items: {type: string}}
                allowedIps: {type: array, items: {type: string}}
                confirmation: {type: string, enum: [API CLIENT]}
      responses:
        '201':
          description: Client
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedApiClient'}
  /system/api/clients/{id}:
    patch:
      operationId: setApiClientStatus
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status, confirmation]
              properties:
                status: {type: string, enum: [active, disabled]}
                confirmation: {type: string, enum: [API CLIENT]}
      responses:
        '200':
          description: Client
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ManagedApiClient'}
  /system/api/clients/{id}/keys:
    post:
      operationId: createManagedApiKey
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes, expiresAt, requestsPerMinute, confirmation]
              properties:
                name: {type: string}
                scopes: {type: array, items: {type: string}}
                expiresAt: {type: string, format: date-time}
                requestsPerMinute: {type: integer}
                confirmation: {type: string, enum: [API KEY]}
      responses:
        '201':
          description: Key secret displayed exactly once
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyActionResult'}
  /system/api/keys/{id}/{action}:
    post:
      operationId: actManagedApiKey
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - in: path
          name: action
          required: true
          schema: {type: string, enum: [revoke, rotate]}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation: {type: string, enum: [API KEY]}
      responses:
        '200':
          description: Revoked or replacement secret (once)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiKeyActionResult'}
  /v1/health:
    get:
      operationId: getExternalHealth
      security: [{ApiKeyBearer: []}]
      responses:
        '200':
          description: Scoped machine API health
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: {type: string}
                  version: {type: string}
  /v1/{resource}:
    get:
      operationId: getExternalRecords
      security: [{ApiKeyBearer: []}]
      parameters:
        - in: path
          name: resource
          required: true
          schema: {type: string, enum: [properties, units, requests]}
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Read-only records restricted to the client organization and matching read scope
          content:
            application/json:
              schema:
                type: object
                required: [items, page, pageSize, organizationId]
                properties:
                  items: {type: array, items: {type: object, additionalProperties: true}}
                  page: {type: integer}
                  pageSize: {type: integer}
                  organizationId: {type: string}
  /system/backups/{id}/inspect:
    post:
      operationId: inspectSystemBackup
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Verified contents summary; not permission to overwrite working data
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupInspection'}
  /system/backup-policies:
    get:
      operationId: getSystemBackupPolicies
      responses:
        '200':
          description: UTC backup schedules, initially disabled
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/BackupPolicy'}
  /system/backup-policies/{kind}:
    put:
      operationId: updateSystemBackupPolicy
      parameters:
        - in: path
          name: kind
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BackupPolicyInput'}
      responses:
        '200':
          description: Saved policy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupPolicy'}
  /system/backups:
    get:
      operationId: getSystemBackups
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Encrypted backup registry and actual readiness
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemBackups'}
    post:
      operationId: createSystemBackup
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemBackupCreateInput'}
      responses:
        '202':
          description: Durable queue entry, not a completed backup
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: {type: string}
                  status: {type: string}
  /system/backups/{id}/verify:
    post:
      operationId: verifySystemBackup
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Ciphertext, authenticated payload and component checksums verified
          content:
            application/json:
              schema:
                type: object
                required: [verified]
                properties:
                  verified: {type: boolean}
  /system/backups/{id}/download:
    get:
      operationId: downloadSystemBackup
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Encrypted package only
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
  /system/backups/{id}:
    delete:
      operationId: deleteSystemBackup
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SystemBackupDeleteInput'}
      responses:
        '204': {description: "Backup bytes removed, audit retained"}
  /system/log-retention:
    get:
      operationId: getSystemLogRetention
      tags: [System]
      responses:
        '200':
          description: Disabled by default; eligible is a preview, not a deleted count
          content:
            application/json:
              schema:
                type: object
                required: [enabled, days, revision, updatedAt, eligible]
                properties:
                  enabled: {type: boolean}
                  days: {type: integer}
                  revision: {type: integer}
                  updatedAt: {type: string}
                  eligible: {type: integer}
    put:
      operationId: saveSystemLogRetention
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogRetentionInput'}
      responses:
        '200':
          description: Updated policy revision; future batches delete operational logs only
          content:
            application/json:
              schema:
                type: object
                required: [revision]
                properties:
                  revision: {type: integer}
  /system/environment:
    get:
      operationId: getSystemEnvironment
      tags: [System]
      responses:
        '200':
          description: Safe allowlisted runtime configuration; no secret values
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemOverview'}
  /system/cache:
    get:
      operationId: getSystemCache
      tags: [System]
      responses:
        '200':
          description: Only actual cache namespaces in the serving process
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemCache'}
  /system/cache/clear:
    post:
      operationId: clearSystemCache
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemCacheClearInput'
      responses:
        '200':
          description: Audited process-local cache invalidation, never sessions
          content:
            application/json:
              schema:
                type: object
                required: [count, durationMs, scope]
                properties:
                  count: {type: integer}
                  durationMs: {type: integer}
                  scope: {type: string}
  /system/sessions:
    get:
      operationId: getSystemSessions
      tags: [System]
      parameters:
        - {in: query, name: userId, schema: {type: string, format: uuid}}
        - {in: query, name: page, schema: {type: integer, minimum: 1}}
      responses:
        '200':
          description: Active signed-in sessions, without cookies or session tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SystemSessions'}
  /system/sessions/revoke:
    post:
      operationId: revokeSystemSessions
      tags: [System]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemSessionRevokeInput'
      responses:
        '200':
          description: Revoked sessions and whether this request signed out the current browser
          content:
            application/json:
              schema:
                type: object
                required: [count, currentRevoked]
                properties:
                  count: {type: integer}
                  currentRevoked: {type: boolean}
  /system/errors:
    get:
      operationId: getSystemErrors
      parameters:
        - {name: page, in: query, schema: {type: integer}}
        - {name: status, in: query, schema: {type: string, enum: [open, resolved]}}
      responses:
        "200":
          description: Grouped error and fatal events, across retained operational history
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemErrors"}
  /system/errors/{fingerprint}:
    get:
      operationId: getSystemError
      parameters:
        - {name: fingerprint, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: Safe metadata and latest 50 related events; no raw stack or request body
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemErrorDetail"}
    patch:
      operationId: updateSystemError
      parameters:
        - {name: fingerprint, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SystemErrorStateInput"}
      responses:
        "200":
          description: Audited status change; fresh events automatically reopen the group
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemErrorGroup"}
        "409": {description: Events or resolution changed; reload before trying again}
  /system/overview:
    get:
      operationId: getSystemOverview
      responses:
        "200":
          description: Safe runtime observations
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemOverview"}
  /system/health:
    get:
      operationId: getSystemHealth
      responses:
        "200":
          description: Safe runtime checks
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemOverview"}
  /system/logs:
    get:
      operationId: getSystemLogs
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: from, in: query, schema: {type: string}}
        - {name: to, in: query, schema: {type: string}}
        - {name: level, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - {name: user, in: query, schema: {type: string}}
        - {name: organization, in: query, schema: {type: string}}
        - {name: requestId, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: integer}}
        - {name: endpoint, in: query, schema: {type: string}}
        - {name: errorCode, in: query, schema: {type: string}}
        - {name: job, in: query, schema: {type: string}}
        - {name: q, in: query, schema: {type: string}}
      responses:
        "200":
          description: Paginated operational metadata, separate from business audit
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemLogs"}
  /system/log-exports:
    post:
      operationId: createSystemLogExport
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SystemLogExportInput"}
      responses:
        "200":
          description: Audited download, at most 5000 rows and 5 MiB; no silent truncation
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemLogExport"}
        "413": {description: Narrow the date range or filters}
        "403": {description: Export permission and platform scope required}
  /system/jobs:
    get:
      operationId: getSystemJobs
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
      responses:
        "200":
          description: Observed scheduled executions
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SystemJobs"}
  /handover-readiness:
    get:
      operationId: getHandoverReadiness
      responses:
        '200':
          description: Scoped units, floor registry and evidence-based readiness
          content: {application/json: {schema: {$ref: '#/components/schemas/HandoverReadiness'}}}
  /handover-floors:
    post:
      operationId: createHandoverFloor
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HandoverFloorInput'}}}
      responses:
        '201':
          description: Existing or newly created floor
          content: {application/json: {schema: {$ref: '#/components/schemas/HandoverFloorReceipt'}}}
  /handover-readiness/{unitId}/floor:
    post:
      operationId: assignHandoverFloor
      parameters:
        - {in: path, name: unitId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/HandoverFloorAssignment'}}}
      responses:
        '200':
          description: Saved mapping revision
          content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanReceipt'}}}
  /unit-plans/{unitId}:
    parameters:
      - {in: path, name: unitId, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getUnitPlan
      responses:
        '200':
          description: Current private plan and defects within handover scope
          content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanView'}}}
    post:
      operationId: changeUnitPlan
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanChange'}}}
      responses:
        '200':
          description: Updated revision
          content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanReceipt'}}}
  /unit-plans/{unitId}/image:
    post:
      operationId: uploadUnitPlan
      parameters:
        - {in: path, name: unitId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: key, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: revision, required: true, schema: {type: integer, minimum: 0}}
        - {in: query, name: planId, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/octet-stream: {schema: {type: string, format: binary}}}
      responses:
        '201':
          description: Sanitized image saved; previous plan retired, never deleted
          content: {application/json: {schema: {$ref: '#/components/schemas/UnitPlanReceipt'}}}
  /unit-plans/{unitId}/{planId}/image:
    get:
      operationId: getUnitPlanImage
      parameters:
        - {in: path, name: unitId, required: true, schema: {type: string, format: uuid}}
        - {in: path, name: planId, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Authorized current plan image
          content: {image/jpeg: {schema: {type: string, format: binary}}}
  /operations/availability/options:
    get:
      operationId: getAvailabilityOptions
      responses:
        '200':
          description: Units within the reader scope; technicians only get units from their work orders
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AvailabilityUnit'}
  /operations/availability:
    get:
      operationId: getStaffAvailability
      parameters:
        - {in: query, name: unitId, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: from, required: true, schema: {type: string, format: date-time}}
        - {in: query, name: to, required: true, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: Scoped interval availability; absence of shifts is unknown, never free
          content: {application/json: {schema: {$ref: '#/components/schemas/StaffAvailability'}}}
    post:
      operationId: createAvailabilityBlock
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBlockInput'}}}
      responses:
        '201':
          description: Saved block, or the existing receipt on retry
          content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBlock'}}}
  /operations/availability/{id}/change:
    post:
      operationId: changeAvailabilityBlock
      parameters:
        - {in: path, name: id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBlockChange'}}}
      responses:
        '200':
          description: Versioned change or cancellation, no hard deletion
          content: {application/json: {schema: {$ref: '#/components/schemas/AvailabilityBlock'}}}
  /defects/{id}/collaboration:
    get:
      operationId: getDefectCollaboration
      description: Assigned-contractor or scoped defect-reader access only. Evidence is not access to the general document catalog.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: before, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Append-only conversation and existing defect evidence
          content: { application/json: { schema: { $ref: '#/components/schemas/DefectCollaboration' } } }
        '403': { description: Missing permission or module }
        '404': { description: Defect or cursor outside scope }
  /defects/{id}/messages:
    post:
      operationId: postDefectMessage
      description: Append a clarification without transitioning the defect. Requires CSRF and defects.execute (assigned contractor) or defects.manage; read-only subscriptions cannot write.
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DefectMessageInput' } } }
      responses:
        '201':
          description: Persisted message, or the same receipt on idempotent retry
          content: { application/json: { schema: { $ref: '#/components/schemas/DefectMessage' } } }
        '400': { description: Invalid text or operation key }
        '403': { description: Write access denied }
        '404': { description: Defect outside scope }
        '409': { description: Operation key reused with different content }
  /role-insights:
    get:
      operationId: getRoleInsights
      description: Live permission/module-scoped role totals. Each card includes its server-side metric definition, canonical query id, permission, module, data scope and empty-state rule. Optional period filters financial cards only.
      parameters:
        - { in: query, name: currency, schema: { type: string, enum: [AMD, RUB, USD] } }
        - { in: query, name: period, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        '200':
          description: Scoped metrics and KPI registry metadata; no inferred trends or external payment revenue
          content:
            application/json:
              schema:
                type: object
                required: [cards]
                properties:
                  cards:
                    type: array
                    items: { $ref: '#/components/schemas/RoleInsightCard' }
        '401': { description: Authentication required }
        '403': { description: Inactive or unavailable role context }
  /platform/implementation-meetings:
    get:
      operationId: listPlatformImplementationMeetings
      description: Internal support planning records. Does not send invitations, email or create tenant governance meetings. Requires global onboarding.manage; operators see their own records and platform leads may see the global queue.
      parameters:
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200': { description: Scoped internal support calendar, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSupportMeetingList' } } } }
        '403': { description: Tenant contexts are not allowed to access the platform support calendar }
    post:
      operationId: createPlatformImplementationMeeting
      description: Create an idempotent internal planning entry; validates IANA time zone, future time, duration and organizer availability. No invitations are sent.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSupportMeetingInput' } } }
      responses:
        '201': { description: Created internal support meeting, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSupportMeeting' } } } }
        '400': { description: "Invalid meeting fields, time zone or time range" }
        '403': { description: Global support calendar permission required }
        '409': { description: "Organizer has an overlapping active meeting or operation conflicts" }
  /platform/implementation-meetings/{id}/change:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: changePlatformImplementationMeeting
      description: Versioned idempotent edit, confirm, cancel or completion. Completed and cancelled records are terminal; changes are appended to an immutable history.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSupportMeetingChangeInput' } } }
      responses:
        '200': { description: Updated meeting, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformSupportMeeting' } } } }
        '403': { description: Not authorized for this meeting }
        '404': { description: Meeting not found in the current operator scope }
        '409': { description: "Stale version, invalid transition or scheduling conflict" }
  /roles/{id}/options:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getAssignmentScopeOptions
      description: IAM-only building and unit identifiers and labels. Does not grant tenant business-data access.
      responses:
        '200': { description: Scope selectors, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '404': { description: Assignment outside authorized scope }
  /iam/catalog:
    get:
      operationId: getIamCatalog
      responses:
        '200': { description: "Immutable role catalog, existing permissions, exceptional grant allowlist", content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
  /iam/users:
    get:
      operationId: listIamUsers
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 100 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, maximum: 100000 } }
      responses:
        '200': { description: "Scoped rows, total, offset and limit; no credentials", content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
  /iam/users/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getIamUser
      responses:
        '200': { description: "Scoped user, assignments and history; hashed session handles for platform admins only", content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '404': { description: Not found or outside scope }
  /iam/users/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: changeIamAccountStatus
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamAccountStatusInput' } } }
      responses:
        '204': { description: Account status changed; disable/lock also revoke sessions }
        '403': { description: Platform administrator required; self changes forbidden }
        '409': { description: Last administrator would be lost }
  /iam/users/{id}/logout:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: revokeIamSessions
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamSessionRevocationInput' } } }
      responses:
        '204': { description: Sessions revoked }
        '403': { description: Platform administrator required; self changes forbidden }
  /iam/profiles:
    get:
      operationId: listIamProfiles
      responses:
        '200': { description: Organization profiles and tenant-allowed global templates, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/IamRecord' } } } } }
    post:
      operationId: createIamProfile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamProfileInput' } } }
      responses:
        '201': { description: Created profile with concurrency token, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '403': { description: Undelegable permission or unauthorized scope }
  /iam/profiles/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateIamProfile
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamProfileInput' } } }
      responses:
        '200': { description: Updated profile; base role immutable, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '409': { description: Concurrent change or administrator protection }
  /iam/assignments/{id}/access:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: explainIamAccess
      description: Shared permission/module/subscription evaluator. Not an unconditional resource authorization; workflow, ownership and session MFA still apply.
      responses:
        '200': { description: "Effective permission decisions, reasons, scope, profile and rules", content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '404': { description: Assignment outside authorized scope }
    post:
      operationId: simulateIamAccess
      description: Read-only permission explanation for a requested HTTP method; does not perform the operation.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamAccessInput' } } }
      responses:
        '200': { description: Permission explanation, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '404': { description: Assignment outside authorized scope }
  /iam/assignments/{id}/policy:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: updateIamAssignmentPolicy
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamAssignmentPolicyInput' } } }
      responses:
        '200': { description: Policy saved and audited, content: { application/json: { schema: { $ref: '#/components/schemas/IamRecord' } } } }
        '403': { description: "Self, protected role, cross-scope or unsupported grant" }
        '409': { description: Concurrent change or inactive assignment }
  /iam/assignments/{id}/status:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: changeIamAssignmentStatus
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/IamAssignmentStatusInput' } } }
      responses:
        '204': { description: Assignment status changed }
        '403': { description: Protected or self assignment }
        '409': { description: Revoked assignment or concurrent change }
  /roles/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getEmployeeAssignment
      description: Requires roles.assign in the active organization context. Base permissions are not effective-access decisions.
      responses:
        '200':
          description: Assignment card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EmployeeAssignmentDetail' }
        '403': { description: Permission denied }
        '404': { description: Assignment outside active scope or not found }
    patch:
      operationId: updateEmployeeAssignment
      description: Changes an active staff assignment, never self or residential lifecycle assignments. Optimistic concurrency token is mandatory.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmployeeAssignmentUpdate' }
      responses:
        '200':
          description: Updated assignment
          content:
            application/json:
              schema:
                type: object
                required: [assignment]
                properties:
                  assignment: { $ref: '#/components/schemas/EmployeeAssignment' }
        '400': { description: Invalid dates or scope }
        '403': { description: Permission denied or immutable assignment }
        '404': { description: Assignment or property outside active scope }
        '409': { description: concurrent_change or last_administrator }
    delete:
      operationId: revokeEmployeeAssignment
      description: Revokes a non-self assignment with scope and last-administrator protection; never deletes the user.
      responses:
        '204': { description: Revoked or already inactive }
        '403': { description: Permission denied }
        '404': { description: Assignment outside active scope }
        '409': { description: last_administrator }
  /leads:
    post:
      operationId: submitLandingLead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandingLeadInput' }
      responses:
        "201":
          description: Stored in the first-party database, not email delivery.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingLeadReceipt' }
        "400": { description: Validation or honeypot rejection }
        "403": { description: CSRF or origin rejected }
        "429": { description: Rate limited }
    get:
      operationId: getLandingLeads
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: sort, in: query, schema: { type: string, enum: [created_at, name] } }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: language, in: query, schema: { type: string, enum: [hy, ru, en] } }
      responses:
        "200":
          description: Separate leads.read permission in platform context.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LandingLeadPage' }
        "403": { description: Forbidden }
  /mfa/policy:
    get:
      operationId: getMfaPolicy
      responses:
        "200":
          description: Current context policy, enrollment, recent proof and management capability.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaPolicyState' }
    put:
      operationId: updateMfaPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaPolicyInput' }
      responses:
        "200":
          description: CAS update; required activation at least 24 hours ahead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaPolicy' }
        "400": { description: Invalid rollout date or input }
        "403": { description: "Privilege, subscription or recent MFA proof required" }
        "409": { description: Version conflict }
  /paged/{resource}:
    get:
      operationId: getScopedRecordPage
      parameters:
        - { name: resource, in: path, required: true, schema: { type: string, enum: [organizations, properties, units, people, invitations, audit] } }
        - { name: page, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
        - { name: q, in: query, schema: { type: string, maxLength: 160 } }
        - { name: sort, in: query, schema: { type: string, maxLength: 40 }, description: Per-resource allowlisted column only. }
        - { name: direction, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: filter, in: query, schema: { type: string, enum: [all, "true", "false"] } }
      responses:
        "200":
          description: Fresh authorized scope; SQL paging and stable tie-breaker.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScopedRecordPage' }
        "400": { description: Invalid query or unsupported sort }
        "403": { description: Forbidden }
  /organizations/{id}/branding/logo:
    get:
      operationId: getPrivateBrandLogo
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Current sanitized logo, active organization context, private no-store.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "404": { description: Not accessible or not the current logo }
  /notifications/catalog:
    get:
      operationId: getNotificationCatalog
      responses:
        "200":
          description: Event catalog, categories, channel readiness and explicit critical policy.
          content:
            application/json:
              schema:
                type: object
                required: [events, categories, channels]
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      required: [code, category, critical]
                      properties:
                        code: {type: string}
                        category: {type: string}
                        critical: {type: boolean}
                  categories: {type: array, items: {type: string}}
                  channels:
                    type: object
                    properties:
                      in_app: {type: string, enum: [active]}
                      email: {type: string, enum: [pending_domain]}
                      sms: {type: string, enum: [future]}
                      push: {type: string, enum: [future]}
  /notifications/preferences:
    get:
      operationId: getNotificationPreferences
      responses:
        "200":
          description: Global user preferences; a missing row has version zero.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPreferences"}
    put:
      operationId: updateNotificationPreferences
      description: Future notifications only. CAS conflict returns 409; only catalog-critical account security overrides opt-out.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NotificationPreferences"}
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema: {$ref: "#/components/schemas/NotificationPreferences"}
  /notifications/due:
    post:
      operationId: examineDueNotifications
      description: Organization-settings permission, idempotent due reminder generation, no email sends.
      responses:
        "200":
          description: Examination summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  examinedDueRecords: {type: integer}
                  email: {type: string, enum: [pending_domain]}
  /organization/branding:
    get:
      operationId: getOrganizationBranding
      responses:
        "200":
          description: Current context organization branding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationBrandingState"}
    put:
      operationId: updateOrganizationBranding
      description: Organization settings permission, CAS version, strict hex colors and HTTPS URLs; no HTML or logo URLs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, branding]
              properties:
                version: {type: integer, minimum: 0}
                branding: {$ref: "#/components/schemas/OrganizationBrandingMetadata"}
      responses:
        "200":
          description: Saved branding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationBrandingState"}
  /organization/branding/logo:
    parameters:
      - name: version
        in: query
        required: true
        schema: {type: integer, minimum: 0}
    post:
      operationId: uploadOrganizationLogo
      description: 2 MB PNG/JPEG/WebP only, sanitized private JPEG; SVG/HTML rejected, stale version returns 409.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        "200":
          description: Saved logo reference
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationBrandingState"}
    delete:
      operationId: removeOrganizationLogo
      description: Clear reference only; never deletes private bytes.
      responses:
        "200":
          description: Updated branding
          content:
            application/json:
              schema: {$ref: "#/components/schemas/OrganizationBrandingState"}
  /portfolio/objects:
    get:
      operationId: listPortfolioObjects
      description: Current organization and building scope; properties.read, no finance module required.
      responses:
        "200":
          description: Real portfolio groups and assigned buildings
          content:
            application/json:
              schema: {type: array, items: {$ref: "#/components/schemas/PortfolioObject"}}
    post:
      operationId: createPortfolioObject
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PortfolioObjectInput"}
      responses:
        "201":
          description: Created empty object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortfolioObject"}
  /portfolio/objects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    patch:
      operationId: updatePortfolioObject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/PortfolioObjectInput"}
                - type: object
                  required: [version]
                  properties:
                    version: {type: integer, minimum: 1}
      responses:
        "200":
          description: Updated object
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortfolioObject"}
    delete:
      operationId: deleteEmptyPortfolioObject
      description: Explicit CAS deletion of an empty group only. Buildings, units and history are never deleted.
      parameters:
        - name: version
          in: query
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Empty object deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: {type: boolean}
  /portfolio/objects/{id}/buildings:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
    put:
      operationId: replacePortfolioBuildings
      description: Atomic organization-scoped CAS; cross-org IDs denied; unassign first before moving from another object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version, buildingIds]
              properties:
                version: {type: integer, minimum: 1}
                buildingIds: {type: array, maxItems: 500, uniqueItems: true, items: {type: string, format: uuid}}
      responses:
        "200":
          description: Saved assignments
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PortfolioObject"}
  /storage/status:
    get:
      operationId: getPrivateStorageStatus
      responses:
        "200":
          description: Safe provider readiness; never returns paths, buckets or credentials.
          content:
            application/json:
              schema:
                type: object
                required: [mode, explicit, productionReady]
                properties:
                  mode: {type: string, enum: [app_storage, local, s3]}
                  explicit: {type: boolean}
                  productionReady: {type: boolean}
  /governance/settings:
    get:
      operationId: getGovernanceSettings
      responses:
        "200": { description: Organization calendar timezone, content: { application/json: { schema: { type: object, required: [timezone], properties: { timezone: { type: string } } } } } }
  /ownerships:
    get:
      operationId: listOwnerships
      parameters:
        - { in: query, name: unitId, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Scoped ownership periods and immutable history, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
    post:
      operationId: createOwnership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, unitId, userId, startsOn, shareBasisPoints, basis]
              properties:
                key: { type: string, format: uuid }
                unitId: { type: string, format: uuid }
                userId: { type: string, format: uuid }
                startsOn: { type: string, format: date }
                endsOn: { type: [string, "null"], format: date }
                shareBasisPoints: { type: integer, minimum: 1, maximum: 10000 }
                basis: { type: string, minLength: 3, maxLength: 1000 }
                basisDocumentId: { type: string, format: uuid }
      responses:
        "201": { description: Created period, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /ownerships/candidates:
    get:
      operationId: listOwnershipCandidates
      responses:
        "200": { description: Active registered organization members, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /ownerships/{id}/end:
    post:
      operationId: endOwnership
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, version, endsOn, reason]
              properties:
                key: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                endsOn: { type: string, format: date }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200": { description: Ended period with retained history, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /governance/meetings:
    get:
      operationId: listGovernanceMeetings
      responses:
        "200": { description: Scoped weighted meetings, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
    post:
      operationId: createGovernanceMeeting
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, buildingId, title, description, startsAt, endsAt, quorumBasisPoints, agenda]
              properties:
                key: { type: string, format: uuid }
                buildingId: { type: string, format: uuid }
                title: { type: string, minLength: 2, maxLength: 200 }
                description: { type: string, maxLength: 8000 }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
                quorumBasisPoints: { type: integer, minimum: 1, maximum: 10000 }
                documentIds: { type: array, maxItems: 20, items: { type: string, format: uuid } }
                agenda:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    required: [title, votingType, options, passOption, passBasisPoints]
                    properties:
                      title: { type: string, minLength: 2, maxLength: 200 }
                      votingType: { type: string, enum: [yes_no, single_choice] }
                      options: { type: array, minItems: 2, maxItems: 10, items: { type: string, minLength: 1, maxLength: 100 } }
                      passOption: { type: string }
                      passBasisPoints: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "201": { description: Created draft, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /governance/meetings/{id}:
    get:
      operationId: getGovernanceMeeting
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Meeting agenda, own eligibility and weighted result", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /governance/meetings/{id}/actions:
    post:
      operationId: changeGovernanceMeeting
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, version, action]
              properties:
                key: { type: string, format: uuid }
                version: { type: integer, minimum: 1 }
                action: { type: string, enum: [publish, cancel, finalize] }
                reason: { type: string, maxLength: 1000 }
      responses:
        "200": { description: "Versioned action, finalize returns protected protocol document ID", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /governance/agenda/{id}/vote:
    post:
      operationId: castWeightedVote
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, eligibilityId, selectedOption]
              properties:
                key: { type: string, format: uuid }
                eligibilityId: { type: string, format: uuid }
                selectedOption: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201": { description: Immutable weighted ballot, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /documents/{id}/versions:
    get:
      operationId: listDocumentVersions
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "Authorized immutable version metadata, no storage keys", content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
    post:
      operationId: uploadDocumentVersion
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: key, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: version, required: true, schema: { type: integer, minimum: 1 } }
        - { in: query, name: title, required: true, schema: { type: string, minLength: 2, maxLength: 160 } }
        - { in: query, name: category, required: true, schema: { type: string, minLength: 2, maxLength: 100 } }
        - { in: query, name: visibility, required: true, schema: { type: string, enum: [staff, residents, unit_owner] } }
        - { in: query, name: relatedType, schema: { type: string, enum: [building, unit, meeting] } }
        - { in: query, name: relatedId, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary } } }
      responses:
        "201": { description: New version with previous-version link, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /documents/{id}/versions/{versionId}/download:
    get:
      operationId: downloadDocumentVersion
      parameters:
        - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: versionId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Private bytes subject to current scope and version visibility, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
  /portfolio/analytics:
    get:
      operationId: getPortfolioAnalytics
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
        - { in: query, name: currency, schema: { type: string, enum: [AMD, RUB, USD] } }
        - { in: query, name: buildingId, schema: { type: string, format: uuid } }
        - { in: query, name: propertyId, schema: { type: string, format: uuid } }
        - { in: query, name: portfolioObjectId, schema: { type: string, format: uuid }, description: "Real organization-scoped portfolio group, independent of buildingId." }
      responses:
        "200": { description: "Exact minor-unit aggregates, definitions, buildings and real monthly series", content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /contractors/scorecard:
    get:
      operationId: getContractorScorecard
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date } }
        - { in: query, name: to, required: true, schema: { type: string, format: date } }
        - { in: query, name: buildingId, schema: { type: string, format: uuid } }
        - { in: query, name: propertyId, schema: { type: string, format: uuid } }
        - { in: query, name: portfolioObjectId, schema: { type: string, format: uuid }, description: Real organization-scoped portfolio group. }
      responses:
        "200": { description: Real scoped work/defect metrics with explicit historical limitations, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
  /portfolio/budgets:
    get:
      operationId: listOperatingBudgets
      responses:
        "200": { description: Scoped recorded budgets, content: { application/json: { schema: { type: array, items: { type: object, additionalProperties: true } } } } }
    post:
      operationId: saveOperatingBudget
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, buildingId, period, currency, amountMinor]
              properties:
                key: { type: string, format: uuid }
                buildingId: { type: string, format: uuid }
                period: { type: string, format: date }
                currency: { type: string, enum: [AMD, RUB,USD] }
                amountMinor: { type: string, pattern: '^\d{1,14}$' }
                version: { type: integer, minimum: 1 }
      responses:
        "200": { description: Recorded budget with CAS and audit, content: { application/json: { schema: { type: object, additionalProperties: true } } } }
  /invitations:
    get:
      operationId: listInvitations
      summary: List invitations in the active permission scope
      responses:
        "200":
          description: Scoped invitations; transport acceptance is not confirmed delivery
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
  /invitations/{id}/resend:
    post:
      operationId: resendInvitation
      summary: Rotate and resend an eligible invitation, optionally correcting its email
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationResendInput"
      responses:
        "200":
          description: Transport receipt, not mailbox confirmation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationSendReceipt"
        "409":
          description: Accepted or revoked invitations cannot be resent
        "503":
          description: Send failed or provider is not configured; no success receipt
