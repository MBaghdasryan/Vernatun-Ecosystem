      parameters:
        - { name: buildingId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Devices explicitly assigned to the current resident unit, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/EdgeResidentDevice' } } } } }
        '403': { description: Resident unit scope or smart-building module unavailable }
  /me/buildings/{buildingId}/devices/{deviceId}/commands:
    post:
      tags: [edge-resident]
      operationId: requestMyBuildingDeviceCommand
      security: [{ SessionCookie: [], CsrfToken: [] }]
      parameters:
        - { name: buildingId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EdgeResidentCommandInput' }
      responses:
        '202': { description: Authorized command sent to the connected Edge Agent, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeResidentCommand' } } } }
        '403': { description: "Role, unit mapping, capability, module, or hard safety policy denied the command" }
        '409': { description: Edge is offline or command could not be delivered }
  /me/edge-commands/{commandId}:
    get:
      tags: [edge-resident]
      operationId: getMyEdgeCommand
      security: [{ SessionCookie: [] }]
      parameters:
        - { name: commandId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Status for a command created by this user, content: { application/json: { schema: { $ref: '#/components/schemas/EdgeResidentCommand' } } } }
        '404': { description: Command is not visible in the current context }
  /payments/callbacks/ameriabank:
    $ref: './payments.yaml#/paths/~1payments~1callbacks~1ameriabank'
  /payments/callbacks/arca:
