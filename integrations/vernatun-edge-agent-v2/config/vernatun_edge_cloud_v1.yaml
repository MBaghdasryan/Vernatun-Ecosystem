version: "1.0"

identity:
  edge_id: "edge-building01"
  edge_name: "Vernatun Edge - Building 01"
  tenant_id: "uk_001"
  building_id: "building01"
  site_code: "building01"

cloud:
  public_url: "https://vernatun.io"
  api_base_url: "https://api.vernatun.io"
  health_url: "https://api.vernatun.io/api/health"

  # IMPORTANT: each Edge opens the connection OUTBOUND to Vernatun Cloud.
  connection_mode: "outbound"

  transport:
    primary: "websocket"
    fallback: "https"
    connect_timeout_seconds: 10
    request_timeout_seconds: 20
    heartbeat_interval_seconds: 30
    reconnect:
      initial_delay_seconds: 2
      max_delay_seconds: 60
      backoff_multiplier: 2.0
      jitter: true

  # Required Cloud-side Edge API contract.
  # The agent tolerates 404/405 here and reports CLOUD_EDGE_API_NOT_IMPLEMENTED
  # until Vernatun Cloud implements these endpoints.
  endpoints:
    register: "/api/edge/v1/register"
    heartbeat: "/api/edge/v1/heartbeat"
    websocket: "/api/edge/v1/connect"
    inventory: "/api/edge/v1/inventory"
    telemetry_batch: "/api/edge/v1/telemetry/batch"
    events_batch: "/api/edge/v1/events/batch"
    alarms_batch: "/api/edge/v1/alarms/batch"
    command_result: "/api/edge/v1/commands/{command_id}/result"
    config_pull: "/api/edge/v1/config"

  auth:
    bootstrap_token_env: "VERNATUN_EDGE_BOOTSTRAP_TOKEN"
    preferred_mode: "mtls"
    client_id_env: "VERNATUN_EDGE_CLIENT_ID"
    client_secret_env: "VERNATUN_EDGE_CLIENT_SECRET"
    client_cert_path_env: "VERNATUN_EDGE_CLIENT_CERT_PATH"
    client_key_path_env: "VERNATUN_EDGE_CLIENT_KEY_PATH"
    ca_cert_path_env: "VERNATUN_EDGE_CA_CERT_PATH"
    credential_rotation_days: 90

local:
  command_authorization:
    base_url: "http://host.docker.internal:8091"
    api_key_env: "VERNATUN_EDGE_LOCAL_API_KEY"
    health_path: "/health"
    command_path: "/v1/commands"
    authorize_path: "/v1/authorize"
    audit_path: "/v1/audit"

  thingsboard:
    base_url: "http://host.docker.internal:8080"
    username_env: "VERNATUN_TB_USERNAME"
    password_env: "VERNATUN_TB_PASSWORD"
    gateway_name: "Vernatun-Edge-Lab-01"

sync:
  inventory:
    enabled: true
    interval_seconds: 300

  telemetry:
    enabled: true
    batch_size: 200
    flush_interval_seconds: 5
    max_local_queue_items: 50000

  events:
    enabled: true
    batch_size: 100
    flush_interval_seconds: 2
    max_local_queue_items: 20000

  alarms:
    enabled: true
    batch_size: 100
    flush_interval_seconds: 2
    max_local_queue_items: 20000

  offline_queue:
    enabled: true
    storage: "sqlite"
    path: "/data/cloud-sync.db"
    max_age_hours: 168
    retry_interval_seconds: 10

commands:
  enabled: true
  accepted_source: "vernatun-cloud"
  local_authorization_required: true
  hard_deny:
    - "FIRE.CONTROL"
    - "ELEVATOR.SAFETY_CONTROL"
  result_reporting:
    enabled: true
    include_device_response: true
    include_authorization_decision: true
    include_audit_reference: true

security:
  expose_local_command_api_publicly: false
  enforce_edge_identity_binding: true
  enforce_tenant_scope: true
  enforce_building_scope: true
  require_command_id: true
  require_idempotency_key: true
  clock_skew_tolerance_seconds: 120

agent:
  listen_host: "0.0.0.0"
  listen_port: 8092
  version: "1.0.0"

logging:
  level: "INFO"
